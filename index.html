<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dreame X60 Pro Ultra Complete – Académie Fnac Darty</title>
<meta name="description" content="E-learning : mise en service, connexion Wi-Fi et entretien du robot Dreame X60 Pro Ultra Complete.">
<style>:root{--black:#111;--ink:#1d1d1f;--yellow:#E9AB00;--yellow-l:#FFF3CC;--orange:#F26B43;--red:#C10F1E;--red-l:#FDECEE;--green:#0B8A43;--green-l:#E4F5EB;--bg:#F1F1F1;--card:#fff;--line:#E1E1E1;--mut:#5b5b5f}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Calibri,Carlito,"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.45;min-height:100vh}
button{font:inherit;cursor:pointer}
header{background:var(--black);color:#fff;position:relative;overflow:hidden}
.hd{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.hd img{height:72px;width:auto;display:block}
.hd h1{font-size:20px;line-height:1.15;margin:0;font-weight:700;flex:1}
.hd h1 small{display:block;font-weight:400;font-size:14px;color:#cfcfcf;margin-top:2px}
.chev{position:absolute;right:0;top:0;bottom:0;width:90px;background:linear-gradient(180deg,#FBAE40,#C10F1E);clip-path:polygon(60% 0,100% 0,100% 100%,60% 100%,100% 50%);opacity:.95}
.hd .pg{font-size:14px;text-align:right;color:#ddd;margin-right:70px;white-space:nowrap}
.bar{height:5px;background:#333}.bar i{display:block;height:100%;width:0;background:var(--yellow);transition:width .4s}
nav.steps{background:#fff;border-bottom:1px solid var(--line)}
nav.steps .in{max-width:1080px;margin:0 auto;display:flex;gap:4px;padding:8px 20px;overflow-x:auto}
nav.steps button{flex:1 1 0;min-width:150px;border:0;background:#f4f4f4;border-radius:10px;padding:8px 12px;text-align:left;color:#333;display:flex;gap:10px;align-items:center;border:2px solid transparent}
nav.steps button .n{width:28px;height:28px;border-radius:50%;background:#ddd;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
nav.steps button .l{font-size:15px;line-height:1.15;font-weight:600}
nav.steps button .l small{display:block;font-weight:400;color:var(--mut);font-size:12.5px}
nav.steps button.on{border-color:var(--yellow);background:#fff}
nav.steps button.on .n{background:var(--black);color:var(--yellow)}
nav.steps button.done .n{background:var(--green);color:#fff}
main{max-width:1080px;margin:0 auto;padding:22px 20px 40px}
.screen{background:var(--card);border-radius:16px;box-shadow:0 2px 14px rgba(0,0,0,.07);padding:28px 30px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);font-weight:700;margin:0 0 4px}
h2{font-size:30px;line-height:1.15;margin:0 0 14px}
h3{font-size:20px;margin:0 0 8px}
p{margin:0 0 12px}
.lead{font-size:20px;color:#333}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.box{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#fff}
.box.ok{border-color:#9ad4b3;background:var(--green-l)}
.box.ko{border-color:#ee9aa2;background:var(--red-l)}
.box.key{border-color:var(--yellow);background:var(--yellow-l)}
.box h3{display:flex;gap:8px;align-items:center}
.ico{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:15px;font-weight:700;color:#fff;flex:none}
.ico.ok{background:var(--green)}.ico.ko{background:var(--red)}.ico.w{background:var(--yellow);color:#111}
ul.l{margin:0;padding-left:0;list-style:none}
ul.l li{padding:5px 0 5px 28px;position:relative}
ul.l li:before{content:"";position:absolute;left:4px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--yellow)}
ul.ok li:before{background:var(--green)}ul.ko li:before{background:var(--red)}
.callout{border-left:6px solid var(--yellow);background:var(--yellow-l);padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0}
.callout.red{border-color:var(--red);background:var(--red-l)}
.callout.green{border-color:var(--green);background:var(--green-l)}
.imgc{text-align:center}.imgc img{max-width:100%;max-height:230px;border-radius:10px;object-fit:contain}
.cap{font-size:14px;color:var(--mut);margin-top:4px}
.pill{display:inline-block;font-size:13px;font-weight:700;border-radius:99px;padding:2px 10px;background:#eee}
.pill.ok{background:var(--green);color:#fff}.pill.ko{background:var(--red);color:#fff}.pill.w{background:var(--yellow);color:#111}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:#d0d0d0}.dots i.on{background:var(--yellow);transform:scale(1.25)}.dots i.past{background:var(--black)}
.btn{border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:17px;background:var(--black);color:#fff}
.btn:hover{background:#333}.btn.y{background:var(--yellow);color:#111}.btn.y:hover{background:#f4b91a}
.btn.ghost{background:#fff;color:#111;border:2px solid #ccc}.btn.ghost:hover{background:#f4f4f4}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;font-size:17px;display:flex;gap:12px;align-items:flex-start;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--yellow);background:var(--yellow-l)}
.opt .k{width:28px;height:28px;border-radius:8px;background:#eee;display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.opt.right{border-color:var(--green);background:var(--green-l)}.opt.right .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-l)}.opt.wrong .k{background:var(--red);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:10px;padding:12px 16px;border-radius:10px;display:none}
.fb.show{display:block}.fb.ok{background:var(--green-l);border-left:6px solid var(--green)}.fb.ko{background:var(--red-l);border-left:6px solid var(--red)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:2px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;font-weight:600;font-size:16px}
.tab.on{background:var(--black);color:#fff;border-color:var(--black)}
table.t{border-collapse:collapse;width:100%;font-size:16px}
table.t th{background:var(--black);color:#fff;text-align:left;padding:8px 10px}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line)}
table.t tr:nth-child(even) td{background:#fafafa}
.steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;counter-reset:s}
.steps5 .st{border-radius:12px;background:#fff;border:1px solid var(--line);padding:14px 12px;position:relative;text-align:center}
.steps5 .st b{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--yellow);color:#111;margin:0 auto 8px;font-size:18px}
.steps5 .st.last{background:var(--black);color:#fff}.steps5 .st.last b{background:var(--red);color:#fff}
.hero{background:var(--black);color:#fff;border-radius:16px;padding:34px 36px;display:flex;gap:26px;align-items:center;position:relative;overflow:hidden}
.hero img{height:150px;flex:none}
.hero h2{font-size:34px;color:#fff;margin-bottom:8px}.hero .lead{color:#ddd}
.hero:after{content:"";position:absolute;right:-30px;top:0;bottom:0;width:120px;background:linear-gradient(180deg,#FBAE40,#C10F1E);clip-path:polygon(50% 0,100% 0,100% 100%,50% 100%,100% 50%)}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.path button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:16px;text-align:left}
.path button:hover{border-color:var(--yellow);box-shadow:0 3px 12px rgba(0,0,0,.08)}
.path .num{font-size:30px;font-weight:800;color:var(--yellow);line-height:1}
.path .mn{font-size:14px;color:var(--mut)}
.score{font-size:64px;font-weight:800;line-height:1}
.qbar{height:8px;border-radius:5px;background:#e5e5e5;margin-bottom:18px}.qbar i{display:block;height:100%;border-radius:5px;background:var(--yellow);transition:width .3s}
.sel{font:inherit;padding:9px 10px;border-radius:8px;border:2px solid #ccc;background:#fff;max-width:100%}
.sel.right{border-color:var(--green);background:var(--green-l)}.sel.wrong{border-color:var(--red);background:var(--red-l)}
.mrow{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;align-items:center;margin:8px 0}
.sock text{font-family:inherit}
.meas{font-weight:800}
@media(max-width:820px){body{font-size:17px}.grid2,.grid3,.grid4,.path{grid-template-columns:1fr}.steps5{grid-template-columns:1fr}.hero{flex-direction:column;text-align:center;padding:26px 20px}.hero img{height:110px}.screen{padding:20px 16px}h2{font-size:25px}.hd h1{font-size:16px}.hd img{height:56px}.hd .pg{display:none}.chev{width:50px}.mrow{grid-template-columns:1fr}}

.vo{max-width:1080px;margin:0 auto;padding:12px 20px 0}
.vo .in{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vo button.vb{border:2px solid var(--black);background:var(--black);color:#fff;border-radius:99px;padding:5px 14px;font-weight:700;font-size:15px}
.vo button.vb.g{background:#fff;color:#111;border-color:#ccc}
.vo details{flex:1 1 100%;font-size:15px;color:#333}.vo summary{cursor:pointer;color:var(--mut)}
.vo details p{margin:6px 0 2px}
footer.cr{max-width:1080px;margin:0 auto;padding:0 20px 24px;font-size:12.5px;color:var(--mut)}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:13px}
.tools b{margin-right:4px}
.chip{background:#fff;border:1px solid #ccc;border-radius:999px;padding:3px 10px;font-weight:600;font-size:12px}

.path{grid-template-columns:repeat(3,1fr)}
.imgc.w img{max-height:250px}.imgc.tall img{max-height:400px}
.tools{margin-top:14px}
.an{transition:opacity .5s ease,transform .5s ease,box-shadow .3s,background-color .3s}
.an.pre{opacity:0;transform:translateY(14px)}
.box.hl,.callout.hl,.st.hl,.imgc.hl,.opt.hl{box-shadow:0 0 0 3px var(--yellow),0 6px 18px rgba(233,171,0,.35)}
li.hl,tr.hl{background:var(--yellow-l);border-radius:6px}
tr.hl td{background:var(--yellow-l)!important}
.path button.hl{border-color:var(--yellow);box-shadow:0 0 0 3px var(--yellow)}
.vp{flex:1 1 100%;height:4px;border-radius:3px;background:#e5e5e5;overflow:hidden}.vp i{display:block;height:100%;width:0;background:var(--yellow)}
#vtxt span{transition:background .2s}#vtxt span.cur{background:var(--yellow-l);box-shadow:0 0 0 2px var(--yellow-l);border-radius:4px}

.secgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start;margin-bottom:12px}
.safecol{display:grid;gap:8px}.safecol .box{padding:10px 14px}.safecol .box h3{font-size:16px;margin:0 0 2px}.safecol .box p{font-size:15px}
.vidbox{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.vidbox video{width:100%;height:100%;display:block;cursor:pointer;background:#000}
.vplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;border:3px solid #fff;background:rgba(0,0,0,.55);color:#fff;font-size:30px;cursor:pointer;padding:0 0 0 6px}
.vplay:hover,.vplay:focus-visible{background:var(--yellow);color:#111;border-color:#111}
.vfs{position:absolute;right:10px;bottom:10px;z-index:3;width:42px;height:42px;border-radius:8px;border:2px solid #fff;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.vfs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.vfs:hover,.vfs:focus-visible{background:var(--yellow);color:#111;border-color:#111}
.vidbox:fullscreen,.vidbox:-webkit-full-screen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0;box-shadow:none;background:#000}
.vidbox:fullscreen video,.vidbox:-webkit-full-screen video{object-fit:contain}
.vsub{position:absolute;left:0;right:0;bottom:0;height:13.9%;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 13%;box-sizing:border-box;color:#fff;font-weight:600;line-height:1.22;text-shadow:0 1px 3px #000,0 0 6px rgba(0,0,0,.85);pointer-events:none;z-index:2;overflow:hidden}
.vsub:empty{display:none}
.vnote{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;padding:0 2.5%;border-radius:10px;background:rgba(24,24,24,.84);color:#fff;font-weight:600;line-height:1.25;opacity:0;transition:opacity .25s;pointer-events:none;z-index:2}
.vnote.on{opacity:1}
@media(max-width:820px){.secgrid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.an{transition:none}}
table.t td:first-child{white-space:nowrap}
@media(max-width:820px){.path{grid-template-columns:1fr}table.t td:first-child{white-space:normal}}

/* ===== Encadré de visionnage unique + disposition identique sur tous les écrans illustrés ===== */
.screen{min-height:560px}
.mlayout{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}
.mlayout .mcol{grid-column:1;grid-row:1;min-width:0}
.mlayout .side{grid-column:2;grid-row:1;display:grid;gap:8px;align-content:start;min-width:0}
.side .box{padding:10px 14px}
.side .box h3{font-size:16px;margin:0 0 2px}
.side .box p{font-size:15px}
.side ul.l li{font-size:15px;padding:3px 0 3px 26px}
.side ul.l li:before{top:9px}
.side .callout{margin:0;font-size:15px}
.side table.t{font-size:14.5px}
.mframe{position:relative;border-radius:12px;overflow:hidden;background:#111;aspect-ratio:16/9;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.mframe img,.mframe video{width:100%;height:100%;display:block;object-fit:contain;max-height:none;border-radius:0}
.imgc.mframe{text-align:initial}
.mcap{font-size:14px;color:var(--mut);margin-top:6px;line-height:1.35;min-height:2.7em}
.mcap span{display:block}
.mbottom{margin-top:14px;display:grid;gap:14px}
.mbottom .callout{margin:0}
.mbottom .grid2,.mbottom .grid3{align-items:start}
.mbottom .box{padding:12px 16px}
.mbottom .box h3{font-size:17px;margin:0 0 4px}
.mbottom .box p{font-size:15.5px}
/* ===== Bascule de langue ===== */
.hd .pg{margin-right:0}
.lang{display:flex;gap:3px;background:#2b2b2b;border-radius:99px;padding:3px;margin-right:70px;flex:none}
.lang button{border:0;background:transparent;color:#ddd;font-weight:700;font-size:13px;letter-spacing:.04em;padding:5px 13px;border-radius:99px}
.lang button:hover{color:#fff}
.lang button.on{background:var(--yellow);color:#111}
.lang button:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(max-width:820px){.mlayout{grid-template-columns:1fr}.mlayout .mcol{grid-column:1;grid-row:1}.mlayout .side{grid-column:1;grid-row:2}.screen{min-height:0}.lang{margin-right:44px}.hd{flex-wrap:wrap}}
</style></head><body>

qyXMG4ByDIWXxe9TCd97BiropTSwBfAAkBmFQIv7uq7HMb21G6c+AZF8M8uJtL8OyzAQgAwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLi7bB/wMjRRd9MoIUSAAAAABJRU5ErkJggg=="};const NARR_FR={"home": "Bonjour, et bienvenue dans ce module de l'Académie Fnac Darty. Aujourd'hui, on va découvrir ensemble le robot aspirateur laveur Dreame X60 Pro Ultra Complete : comment le mettre en service, le connecter, l'entretenir, et répondre aux questions de vos clients. Installez-vous confortablement, on y va pas à pas.", "m1_s1": "Le Dreame X60 Pro Ultra Complete, c'est un robot qui aspire et qui lave, accompagné d'une station d'accueil qui fait presque tout le travail à votre place. La station vide automatiquement le bac à poussière, lave et sèche les serpillières, et remplit le réservoir d'eau du robot. Le robot repère les obstacles grâce à sa vision binoculaire, et se pilote depuis l'application Dreamehome, ou même à la voix.", "m1_s2": "Dans ce module, on a quatre objectifs. Un : installer et mettre en service le robot dès la réception. Deux : le connecter au Wi-Fi sans stress. Trois : réaliser l'entretien courant, et savoir quand passer par le SAV. Et quatre : répondre aux questions les plus fréquentes. À la fin, un quiz de dix questions vous permettra de valider vos acquis.", "m1_s3": "Le parcours se déroule en cinq étapes : la mise en service, la connexion Wi-Fi, l'entretien, la FAQ, puis le quiz final. Comptez environ vingt minutes en tout. Vous pouvez faire une pause entre deux chapitres, et revenir en arrière quand vous voulez. Allez, c'est parti !", "m2_s1": "On commence par ouvrir le carton. Sortez les éléments un par un, et comparez avec la liste imprimée dans l'emballage : le robot, la station d'accueil, son cordon d'alimentation, les serpillières, les brosses et la solution de nettoyage. Regardez ensuite l'état général : pas de choc visible, pas de pièce cassée, pas de cordon abîmé. Et gardez l'emballage d'origine, il servira pour transporter le robot.", "m2_s2": "Quelques consignes de sécurité à connaître absolument. Utilisez le robot uniquement entre zéro et quarante degrés. Ne le soulevez pas et ne le sortez pas de la station pendant qu'il fonctionne. Gardez enfants et animaux à distance. Ne versez dans le réservoir que de l'eau propre et la solution agréée : jamais d'alcool ni de désinfectant. N'aspirez pas d'objets durs ou tranchants. Et si le cordon est endommagé, on arrête tout et on contacte le service après-vente.", "m2_s3": "Première mise sous tension. Posez le robot sur la station, avec les serpillières face à la planche à laver. Une notification vocale confirme que la connexion est bonne, et le robot démarre la charge. Sinon, maintenez le bouton d'alimentation trois secondes. Conseil du constructeur : chargez complètement le robot avant la première utilisation.", "m2_s3v": "On pose le robot sur la station. Une annonce vocale confirme la charge. Avant le premier nettoyage, vérifiez que le robot part bien de sa station, pour la sécurité et le bon fonctionnement. Rangez les objets fragiles, précieux, dangereux ou faciles à renverser, et dégagez un maximum d'espace ! Après la configuration du réseau, suivez les instructions de l'appli pour créer rapidement une carte. Le robot cartographie sans nettoyer. Une fois la carte terminée, vous pouvez définir des zones selon l'agencement de votre logement. Par exemple pour vos meubles, vos tapis ou des murs virtuels. Si votre logement compte plusieurs étages, utilisez la gestion multi-étages de l'appli. Posez le robot à l'étage voulu quand il est en veille, pas pendant un nettoyage. Pas besoin de déplacer la station : créez simplement une nouvelle carte. Pour les nettoyages suivants, posez directement le robot à l'étage voulu. Il reconnaît alors la carte tout seul, et revient à son point de départ en fin de tâche.", "m2_s4": "Voyons ce qui se passe pendant un nettoyage. Pour que le robot retrouve facilement sa station, lancez-le depuis la station. Les serpillières sont lavées avant le départ, puis régulièrement pendant le nettoyage. À la fin, la station vide le bac à poussière, puis lave et sèche les serpillières. Attention, ne déplacez pas la station ni les réservoirs pendant l'utilisation, et ne touchez pas la sortie d'eau : elle peut être chaude.", "m2_s5": "Ce qu'il faut retenir du chapitre un. Premièrement : une station bien placée, dégagée, avec du Wi-Fi. Deuxièmement : la sécurité d'abord, usage en intérieur entre zéro et quarante degrés, enfants et animaux à distance. Troisièmement : de l'eau propre non chaude, et la solution agréée uniquement. Et quatrièmement : on charge le robot avant la première utilisation. Direction le Wi-Fi !", "m2_s2v": "Regardons ensemble la vidéo officielle Dreame, du carton jusqu'à l'allumage du robot. On ouvre le carton extérieur, puis on sort tous les accessoires. On compare avec la liste pour confirmer qu'il ne manque rien : robot, station et plaque de rampe, brosses, serpillières, bac, sacs et solution. Ensuite, on retire tous les films et protections de transport de la station. Prenez le temps de bien tout enlever, sur la porte comme à l'intérieur. Installez la station dans un endroit dégagé, avec un bon signal Wi-Fi, idéalement sur du carrelage ou du marbre. Gardez un mètre devant la station, cinq centimètres de chaque côté, et rien dans les zones grisées. Vérifiez que le filtre de la planche à laver est bien installé. Posez la plaque d'extension de rampe. Enfoncez fermement le cordon d'alimentation, puis branchez-le sur la prise. Le voyant de la station doit s'allumer. Place à la solution de nettoyage : sortez le compartiment de la solution automatique. Ouvrez le couvercle du module de remplissage et versez la solution officielle Dreame. Refermez le couvercle, remettez le module en place, puis installez le couvercle du bac. Le remplissage est ensuite automatique. Sortez le réservoir d'eau propre, remplissez-le, surtout pas avec de l'eau chaude, puis remettez-le en place. Place au robot. Retirez les films et bandes de protection. Pour l'allumer, appuyez trois secondes sur le bouton d'alimentation. Le voyant s'allume : le robot est sous tension. Retournez ensuite le robot, et fixez les serpillières sur leurs supports. Voilà pour la préparation !", "m3_s1": "Chapitre deux : la connexion au Wi-Fi. C'est souvent là que les clients bloquent, alors on va voir la méthode, et surtout les pièges à éviter.", "m3_s2": "Avant de commencer, trois prérequis. Un smartphone connecté à votre box. Le mot de passe du Wi-Fi sous la main. Et une bonne couverture Wi-Fi à l'endroit où se trouve la station. Surtout, retenez ceci : le robot ne reconnaît que le réseau deux virgule quatre gigahertz. Le cinq gigahertz n'est pas pris en charge. Si la box fusionne les deux bandes sous un même nom, pensez à les séparer.", "m3_s3": "Installez l'application Dreamehome. Cherchez-la dans la boutique d'applications de votre téléphone, ou scannez le code QR situé sous le couvercle du robot. Si c'est votre première utilisation, créez un compte en suivant les indications à l'écran. Petite précision : l'application évolue régulièrement, donc les écrans peuvent légèrement différer de la notice. Suivez toujours les instructions de la version actuelle.", "m3_s3v": "On ouvre le cache du robot, puis on scanne le code QR avec son téléphone. Sinon, cherchez Dreamehome dans l'App Store ou sur Google Play, puis téléchargez et installez l'application. Ouvrez l'application. Une fois connecté, touchez l'option pour scanner le code QR de connexion, puis scannez à nouveau le code QR du robot pour ajouter l'appareil. Sinon, ajoutez-le manuellement en choisissant votre modèle dans la liste. Terminez la connexion en suivant les invites de l'appli. Le voyant du robot clignote lentement : il est en mode appairage réseau. Le réseau doit être en deux virgule quatre gigahertz. Une fois la connexion réussie, personnalisez les réglages depuis l'application. Pensez à mettre à jour le firmware vers la dernière version. À la première utilisation, le robot nettoie par défaut en mode aspiration et lavage. Vous pouvez ensuite choisir le mode voulu : puissance d'aspiration, humidité de la serpillière et autres réglages dans l'appli. Touchez l'icône des réglages, en haut à droite, pour accéder à d'autres options. Si vous avez un animal, activez le mode animaux de compagnie. Pour démarrer, lancez le nettoyage depuis l'appli, ou appuyez brièvement sur le bouton d'alimentation du robot. Il nettoie en suivant l'itinéraire optimal calculé d'après la carte. En cours de route, il retourne laver la serpillière, selon vos réglages de lavage. De retour à la station, il se remplit en eau automatiquement, puis reprend le nettoyage. Une fois la tâche terminée, il retourne se recharger, et la station vide la poussière, lave et sèche la serpillière. Pendant le lavage, ne déplacez pas la station, ni le réservoir, ni la planche à laver. Ensuite, pensez à nettoyer le réservoir d'eau usée, pour éviter les mauvaises odeurs. Suivez ces étapes, et profitez d'un nettoyage tout confort avec votre robot Dreame !", "m3_s4": "Pour savoir où en est la connexion, regardez le voyant Wi-Fi. Il clignote lentement : le robot est prêt à être connecté. Il clignote rapidement : la connexion est en cours. Il reste allumé : le robot est connecté. Pour valider, vérifiez que le robot apparaît bien dans l'application, puis lancez la cartographie rapide : le robot explore le logement sans nettoyer, et la carte s'enregistre automatiquement quand il revient à la station.", "m3_s5": "Le robot ne se connecte pas ? Passez en revue les quatre causes les plus fréquentes. Mot de passe incorrect : ressaisissez-le avec soin. Réseau cinq gigahertz : basculez sur le deux virgule quatre. Signal trop faible : vérifiez que le robot est dans une zone bien couverte. Et robot pas prêt : fermez complètement l'application, rouvrez-la, puis recommencez la procédure.", "m3_s6": "Besoin de repartir de zéro ? Pour reconfigurer le Wi-Fi, répétez l'appairage et suivez les instructions. Pour déconnecter le robot du réseau, maintenez le bouton de réinitialisation trois secondes. Attention : la notice indique aussi que ce même geste rétablit les paramètres d'usine. Prévenez donc toujours le client avant, pour qu'il sache ce qu'il va perdre.", "m3_s7": "Ce qu'il faut retenir du chapitre deux. Un : uniquement du Wi-Fi deux virgule quatre gigahertz. Deux : on scanne le code QR du robot dans l'application Dreamehome. Trois : le voyant Wi-Fi vous dit où en est la connexion. Et quatre : en cas de blocage, on vérifie le mot de passe, le signal, puis on relance l'application.", "m4_s1": "Chapitre trois : l'entretien. Un robot bien entretenu garde ses performances, et c'est aussi le meilleur moyen d'éviter les pannes. On voit ce que l'utilisateur peut faire seul, et ce qui relève du SAV.", "m4_s2": "Comment savoir qu'un entretien est nécessaire ? Le robot vous le dit, il faut juste savoir l'écouter. Un bruit qui augmente. Une odeur qui s'installe : c'est souvent le réservoir d'eau sale. Un robot qui patine, ou qui s'écarte de son itinéraire. Ou une station qui ne vide plus le bac à poussière. Dans tous ces cas, direction le tableau d'entretien.", "m4_s3": "Voici le calendrier à retenir. Après chaque utilisation : le réservoir d'eau sale et la brosse de nettoyage des plinthes. Toutes les deux semaines : le réservoir d'eau propre, les brosses, le filtre du bac à poussière et les plateaux de serpillière. Tous les un à deux mois : le filtre de la planche à laver. Tous les six mois : le module de chauffage. Et une fois par mois : les capteurs, les contacts de charge, les évents et les roues. La notice précise que ces fréquences dépendent de l'usage.", "m4_s4": "Premier bloc : ce que l'utilisateur fait lui-même. Le filtre et le bac à poussière : rincez-les uniquement à l'eau claire, sans détergent, sans brosse ni objet pointu, et remontez-les seulement quand ils sont complètement secs. Pour les brosses principales et la brosse latérale, retirez les cheveux et les poils emmêlés, puis remettez-les en place jusqu'au clic. Soyez prudent en retirant les brosses : on peut se blesser.", "m4_s5": "Deuxième bloc, le circuit d'eau. Videz et rincez le réservoir d'eau sale après chaque utilisation, en ménageant la boule flottante, qui est fragile. Rincez aussi le filtre de la planche à laver. Attention, le module de chauffage peut rester chaud : attendez qu'il refroidisse. Côté consommables, les serpillières se changent tous les un à trois mois, et le sac à poussière tous les deux à quatre mois.", "m4_s6": "Troisième bloc : les capteurs. Une fois par mois, essuyez avec un chiffon doux et sec les capteurs du robot, la fenêtre du pare-chocs et la lumière d'éclairage. Même chose pour les contacts de charge, les évents de vidage et la zone d'émission du signal de la station. Jamais de chiffon humide, qui peut abîmer les éléments sensibles. Pour la roue omnidirectionnelle, rincez-la sous l'eau courante et remettez-la quand elle est complètement sèche.", "m4_s7": "Les erreurs à éviter, ce sont des classiques. Un chiffon humide sur le robot ou la station. Du détergent sur le filtre. De l'eau chaude ou un désinfectant dans le réservoir d'eau propre. Un outil tranchant ou un produit corrosif sur le module de chauffage. Des pièces remontées encore humides. Et oublier de débrancher la fiche avant un entretien.", "m4_s8": "Qui fait quoi ? L'utilisateur peut réaliser tout l'entretien courant : vider, rincer, essuyer, changer les consommables. En revanche, certaines opérations relèvent du SAV : le remplacement de la batterie, réservé à une personne qualifiée, un cordon d'alimentation endommagé, ou un problème qui persiste après les vérifications de base. On ne démonte jamais la batterie ni la station soi-même. Et si le robot reste longtemps inutilisé : charge complète, extinction, rangement au sec, et recharge au moins tous les trois mois.", "m4_s9": "Ce qu'il faut retenir du chapitre trois. Un : on vide le réservoir d'eau sale après chaque utilisation. Deux : bac, filtre et brosses, toutes les deux semaines, à l'eau claire uniquement. Trois : chiffon sec pour les capteurs, jamais humide. Et quatre : batterie et cordon abîmé, c'est pour le SAV.", "m5_s1": "Chapitre quatre : la FAQ. Dix questions que vos clients vont vous poser, avec la réponse simple à leur donner. Elles viennent toutes de la FAQ officielle du site d'assistance Dreame.", "m5_s2": "Question un : pourquoi le robot hoche-t-il la tête quand il s'arrête ? Rassurez le client : c'est normal. Ce petit mouvement sert à repérer les obstacles avec précision et à garder le robot stable. Si cela se répète souvent, on redémarre le robot ; sinon, on contacte le service client. Question deux : le robot vibre et frotte pendant la recharge. C'est normal aussi : pour mieux se recharger, les roues motrices frottent contre le socle de la station. Cela n'a aucun effet sur l'utilisation.", "m5_s3": "Question trois : le ventilateur de refroidissement est bruyant. C'est normal dans les modes autonomie illimitée et charge onze ampères : la batterie chauffe, alors le ventilateur tourne vite pour évacuer la chaleur. Question quatre : les contacts de charge noircissent ou jaunissent. Là encore, c'est normal : l'argent des électrodes réagit à l'air ambiant, sans conséquence sur l'utilisation. En revanche, si le robot ne charge pas, vérifiez que l'autocollant de l'électrode de charge a bien été retiré.", "m5_s4": "Question cinq : un fil ou un câble bloque le bras d'extension. Dans l'application, ouvrez Paramètres, Fonctions auxiliaires, puis Entretien de l'équipement. Déployez l'extension au maximum, et retirez l'obstacle à la main. Et si le bras ne se rétracte pas, utilisez l'option Réinitialiser la serpillière, puis Rétracter. Question six : la serpillière s'enroule autour des cheveux. Activez le mode serpillière après aspiration pour limiter l'emmêlement, ou retirez la serpillière et nettoyez-la à la main.", "m5_s5": "Question sept : le robot ne passe pas sous un meuble bas. Sa hauteur est d'environ quatre-vingt-neuf millimètres. Si l'espace est suffisant, activez le mode Couverture extrême, ou ajoutez des zones de faible hauteur dans l'édition de la carte. Question huit : le robot ne franchit pas un seuil. Il passe en général les marches simples de moins de cinquante-deux millimètres. Vérifiez aussi si la marche est noire ou foncée. Entre cinquante-deux et cent millimètres, on conseille un tapis d'escalade.", "m5_s6": "Question neuf : il reste des traces d'eau après le passage du robot. Un peu d'humidité reste toujours, puis elle s'évapore. Pour limiter les traces, baissez le débit d'eau, contrôlez le disque de nettoyage, et changez régulièrement la serpillière. Question dix : le robot ne détecte pas une tache ou des poils. Activez la reconnaissance par amélioration de la lumière et le Boost des grosses particules, et mettez à jour le firmware. En cas de fausse détection, utilisez Signaler une erreur. Et en cas de doute ou de panne persistante, contactez le SAV.", "intro_quiz": "Place au quiz final ! Dix questions, quatre propositions chacune, une seule bonne réponse. Après chaque réponse, je vous donne la correction détaillée. Trois questions sur la mise en service, trois sur le Wi-Fi, deux sur l'entretien et deux sur la FAQ. Prenez votre temps, et bonne chance.", "q1": "Question 1, mise en service. Où faut-il installer la station d'accueil ?", "a1": "La bonne réponse est la B : Dans un endroit dégagé, avec un bon signal Wi-Fi, idéalement sur carrelage ou marbre.", "q2": "Question 2, mise en service. Que peut-on verser dans le réservoir d'eau propre ?", "a2": "La bonne réponse est la D : De l'eau propre et la solution de nettoyage agréée uniquement.", "q3": "Question 3, mise en service. Comment allume-t-on le robot ?", "a3": "La bonne réponse est la A : Un appui de 3 secondes sur le bouton d'alimentation.", "q4": "Question 4, connexion wi-fi. Quel réseau Wi-Fi le robot reconnaît-il ?", "a4": "La bonne réponse est la C : Uniquement le réseau 2,4 GHz.", "q5": "Question 5, connexion wi-fi. Comment ajoute-t-on le robot dans l'application Dreamehome ?", "a5": "La bonne réponse est la B : En scannant le code QR situé sous le couvercle du robot.", "q6": "Question 6, connexion wi-fi. Le voyant Wi-Fi clignote rapidement. Que signifie-t-il ?", "a6": "La bonne réponse est la C : La connexion est en cours.", "q7": "Question 7, entretien. Que faut-il nettoyer après chaque utilisation ?", "a7": "La bonne réponse est la D : Le réservoir d'eau sale et la brosse de nettoyage des plinthes.", "q8": "Question 8, entretien. Comment nettoyer le filtre du bac à poussière ?", "a8": "La bonne réponse est la A : Le rincer à l'eau claire sans détergent, puis le sécher complètement.", "q9": "Question 9, FAQ. Votre client s'inquiète : son robot hoche la tête à chaque arrêt. Que lui répondez-vous ?", "a9": "La bonne réponse est la C : C'est normal : ce mouvement sert à repérer précisément les obstacles.", "q10": "Question 10, FAQ. Un câble est coincé dans le bras d'extension du robot. Que faire ?", "a10": "La bonne réponse est la B : Déployer l'extension au maximum depuis l'appli, puis retirer l'obstacle à la main.", "res": "Quiz terminé ! Consultez votre score à l'écran. Si certaines notions vous ont posé problème, n'hésitez pas à revenir sur le chapitre correspondant, puis à retenter le quiz.", "concl": "Bravo, vous avez terminé ce module ! Vous savez maintenant installer, connecter et entretenir le Dreame X60 Pro Ultra Complete, et répondre aux questions de vos clients. Et si une situation dépasse ces vérifications de base, pensez au SAV : les centres d'appels, les comptoirs SAV en magasin et les ateliers SAV Fnac Darty sont là pour prendre le relais. Merci, et à très bientôt !"};const TIMES={"home": {"s": [0.31, 4.82, 17.71],
