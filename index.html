const PTV={"m2_s2v": {"s": [0.28, 5.77, 10.06, 20.4, 25.37, 30.87, 37.78, 44.3, 48.25, 50.64, 54.6, 57.84, 62.88, 67.44, 72.81, 75.72, 82.01, 86.12, 89.89, 93.18, 98.38], "d": 99.68}, "m2_s3v": {"s": [0.38, 2.47, 5.62, 13.09, 19.93, 25.72, 28.4, 34.7, 38.03, 43.6, 49.1, 53.26, 57.26], "d": 61.91}, "m3_s3v": {"s": [0.22, 5.39, 12.96, 14.56, 19.97, 24.43, 29.34, 33.06, 41.82, 46.81, 50.92, 56.27, 62.98, 68.05, 71.95, 78.57, 82.33, 87.08, 92.16, 98.09, 103.25, 107.7], "d": 111.81}};const VANC={"m2_s2v": [0, 11, 18.5, 24, 32, 44.5, 50, 56, 59.5, 64, 68, 71, 77, 81, 87, 90, 98, 101, 107, 110, 117, 119], "m2_s3v": [0, 3, 9, 16, 26, 30, 34, 40.5, 51, 65, 71, 74, 80, 86.5], "m3_s3v": [0, 3, 11.5, 14.5, 18, 21, 25, 30, 38, 49, 57, 64, 71, 78, 85, 93, 98, 106, 113, 125, 131, 137.5, 143.5]};const SEG_FR={"home": ["Bonjour, et bienvenue dans ce module de l'Académie Fnac Darty.", "Aujourd'hui, on va découvrir ensemble le robot aspirateur laveur Dreame X60 Pro Ultra Complete : comment le mettre en service, le connecter, l'entretenir, et répondre aux questions de vos clients.", "Installez-vous confortablement, on y va pas à pas."], "m1_s1": ["Le Dreame X60 Pro Ultra Complete, c'est un robot qui aspire et qui lave, accompagné d'une station d'accueil qui fait presque tout le travail à votre place.", "La station vide automatiquement le bac à poussière, lave et sèche les serpillières, et remplit le réservoir d'eau du robot.", "Le robot repère les obstacles grâce à sa vision binoculaire, et se pilote depuis l'application Dreamehome, ou même à la voix."], "m1_s2": ["Dans ce module, on a quatre objectifs.", "Un : installer et mettre en service le robot dès la réception.", "Deux : le connecter au Wi-Fi sans stress.", "Trois : réaliser l'entretien courant, et savoir quand passer par le SAV.", "Et quatre : répondre aux questions les plus fréquentes.", "À la fin, un quiz de dix questions vous permettra de valider vos acquis."], "m1_s3": ["Le parcours se déroule en cinq étapes : la mise en service, la connexion Wi-Fi, l'entretien, la FAQ, puis le quiz final.", "Comptez environ vingt minutes en tout.", "Vous pouvez faire une pause entre deux chapitres, et revenir en arrière quand vous voulez.", "Allez, c'est parti !"], "m2_s1": ["On commence par ouvrir le carton.", "Sortez les éléments un par un, et comparez avec la liste imprimée dans l'emballage : le robot, la station d'accueil, son cordon d'alimentation, les serpillières, les brosses et la solution de nettoyage.", "Regardez ensuite l'état général : pas de choc visible, pas de pièce cassée, pas de cordon abîmé.", "Et gardez l'emballage d'origine, il servira pour transporter le robot."], "m2_s2": ["Quelques consignes de sécurité à connaître absolument.", "Utilisez le robot uniquement entre zéro et quarante degrés.", "Ne le soulevez pas et ne le sortez pas de la station pendant qu'il fonctionne.", "Gardez enfants et animaux à distance.", "Ne versez dans le réservoir que de l'eau propre et la solution agréée : jamais d'alcool ni de désinfectant.", "N'aspirez pas d'objets durs ou tranchants.", "Et si le cordon est endommagé, on arrête tout et on contacte le service après-vente."], "m2_s3": ["Première mise sous tension.", "Posez le robot sur la station, avec les serpillières face à la planche à laver.", "Une notification vocale confirme que la connexion est bonne, et le robot démarre la charge.", "Sinon, maintenez le bouton d'alimentation trois secondes.", "Conseil du constructeur : chargez complètement le robot avant la première utilisation."], "m2_s3v": ["On pose le robot sur la station.", "Une annonce vocale confirme la charge.", "Avant le premier nettoyage, vérifiez que le robot part bien de sa station, pour la sécurité et le bon fonctionnement.", "Rangez les objets fragiles, précieux, dangereux ou faciles à renverser, et dégagez un maximum d'espace !", "Après la configuration du réseau, suivez les instructions de l'appli pour créer rapidement une carte.", "Le robot cartographie sans nettoyer.", "Une fois la carte terminée, vous pouvez définir des zones selon l'agencement de votre logement.", "Par exemple pour vos meubles, vos tapis ou des murs virtuels.", "Si votre logement compte plusieurs étages, utilisez la gestion multi-étages de l'appli.", "Posez le robot à l'étage voulu quand il est en veille, pas pendant un nettoyage.", "Pas besoin de déplacer la station : créez simplement une nouvelle carte.", "Pour les nettoyages suivants, posez directement le robot à l'étage voulu.", "Il reconnaît alors la carte tout seul, et revient à son point de départ en fin de tâche."], "m2_s4": ["Voyons ce qui se passe pendant un nettoyage.", "Pour que le robot retrouve facilement sa station, lancez-le depuis la station.", "Les serpillières sont lavées avant le départ, puis régulièrement pendant le nettoyage.", "À la fin, la station vide le bac à poussière, puis lave et sèche les serpillières.", "Attention, ne déplacez pas la station ni les réservoirs pendant l'utilisation, et ne touchez pas la sortie d'eau : elle peut être chaude."], "m2_s5": ["Ce qu'il faut retenir du chapitre un.", "Premièrement : une station bien placée, dégagée, avec du Wi-Fi.", "Deuxièmement : la sécurité d'abord, usage en intérieur entre zéro et quarante degrés, enfants et animaux à distance.", "Troisièmement : de l'eau propre non chaude, et la solution agréée uniquement.", "Et quatrièmement : on charge le robot avant la première utilisation.", "Direction le Wi-Fi !"], "m2_s2v": ["Regardons ensemble la vidéo officielle Dreame, du carton jusqu'à l'allumage du robot.", "On ouvre le carton extérieur, puis on sort tous les accessoires.", "On compare avec la liste pour confirmer qu'il ne manque rien : robot, station et plaque de rampe, brosses, serpillières, bac, sacs et solution.", "Ensuite, on retire tous les films et protections de transport de la station.", "Prenez le temps de bien tout enlever, sur la porte comme à l'intérieur.", "Installez la station dans un endroit dégagé, avec un bon signal Wi-Fi, idéalement sur du carrelage ou du marbre.", "Gardez un mètre devant la station, cinq centimètres de chaque côté, et rien dans les zones grisées.", "Vérifiez que le filtre de la planche à laver est bien installé.", "Posez la plaque d'extension de rampe.", "Enfoncez fermement le cordon d'alimentation, puis branchez-le sur la prise.", "Le voyant de la station doit s'allumer.", "Place à la solution de nettoyage : sortez le compartiment de la solution automatique.", "Ouvrez le couvercle du module de remplissage et versez la solution officielle Dreame.", "Refermez le couvercle, remettez le module en place, puis installez le couvercle du bac.", "Le remplissage est ensuite automatique.", "Sortez le réservoir d'eau propre, remplissez-le, surtout pas avec de l'eau chaude, puis remettez-le en place.", "Place au robot. Retirez les films et bandes de protection.", "Pour l'allumer, appuyez trois secondes sur le bouton d'alimentation.", "Le voyant s'allume : le robot est sous tension.", "Retournez ensuite le robot, et fixez les serpillières sur leurs supports.", "Voilà pour la préparation !"], "m3_s1": ["Chapitre deux : la connexion au Wi-Fi.", "C'est souvent là que les clients bloquent, alors on va voir la méthode, et surtout les pièges à éviter."], "m3_s2": ["Avant de commencer, trois prérequis.", "Un smartphone connecté à votre box.", "Le mot de passe du Wi-Fi sous la main.", "Et une bonne couverture Wi-Fi à l'endroit où se trouve la station.", "Surtout, retenez ceci : le robot ne reconnaît que le réseau deux virgule quatre gigahertz.", "Le cinq gigahertz n'est pas pris en charge.", "Si la box fusionne les deux bandes sous un même nom, pensez à les séparer."], "m3_s3": ["Installez l'application Dreamehome.", "Cherchez-la dans la boutique d'applications de votre téléphone, ou scannez le code QR situé sous le couvercle du robot.", "Si c'est votre première utilisation, créez un compte en suivant les indications à l'écran.", "Petite précision : l'application évolue régulièrement, donc les écrans peuvent légèrement différer de la notice.", "Suivez toujours les instructions de la version actuelle."], "m3_s3v": ["On ouvre le cache du robot, puis on scanne le code QR avec son téléphone.", "Sinon, cherchez Dreamehome dans l'App Store ou sur Google Play, puis téléchargez et installez l'application.", "Ouvrez l'application.", "Une fois connecté, touchez l'option pour scanner le code QR de connexion,", "puis scannez à nouveau le code QR du robot pour ajouter l'appareil.", "Sinon, ajoutez-le manuellement en choisissant votre modèle dans la liste.", "Terminez la connexion en suivant les invites de l'appli.", "Le voyant du robot clignote lentement : il est en mode appairage réseau. Le réseau doit être en deux virgule quatre gigahertz.", "Une fois la connexion réussie, personnalisez les réglages depuis l'application.", "Pensez à mettre à jour le firmware vers la dernière version.", "À la première utilisation, le robot nettoie par défaut en mode aspiration et lavage.", "Vous pouvez ensuite choisir le mode voulu : puissance d'aspiration, humidité de la serpillière et autres réglages dans l'appli.", "Touchez l'icône des réglages, en haut à droite, pour accéder à d'autres options.", "Si vous avez un animal, activez le mode animaux de compagnie.", "Pour démarrer, lancez le nettoyage depuis l'appli, ou appuyez brièvement sur le bouton d'alimentation du robot.", "Il nettoie en suivant l'itinéraire optimal calculé d'après la carte.", "En cours de route, il retourne laver la serpillière, selon vos réglages de lavage.", "De retour à la station, il se remplit en eau automatiquement, puis reprend le nettoyage.", "Une fois la tâche terminée, il retourne se recharger, et la station vide la poussière, lave et sèche la serpillière.", "Pendant le lavage, ne déplacez pas la station, ni le réservoir, ni la planche à laver.", "Ensuite, pensez à nettoyer le réservoir d'eau usée, pour éviter les mauvaises odeurs.", "Suivez ces étapes, et profitez d'un nettoyage tout confort avec votre robot Dreame !"], "m3_s4": ["Pour savoir où en est la connexion, regardez le voyant Wi-Fi.", "Il clignote lentement : le robot est prêt à être connecté.", "Il clignote rapidement : la connexion est en cours.", "Il reste allumé : le robot est connecté.", "Pour valider, vérifiez que le robot apparaît bien dans l'application, puis lancez la cartographie rapide : le robot explore le logement sans nettoyer, et la carte s'enregistre automatiquement quand il revient à la station."], "m3_s5": ["Le robot ne se connecte pas ?", "Passez en revue les quatre causes les plus fréquentes.", "Mot de passe incorrect : ressaisissez-le avec soin.", "Réseau cinq gigahertz : basculez sur le deux virgule quatre.", "Signal trop faible : vérifiez que le robot est dans une zone bien couverte.", "Et robot pas prêt : fermez complètement l'application, rouvrez-la, puis recommencez la procédure."], "m3_s6": ["Besoin de repartir de zéro ?", "Pour reconfigurer le Wi-Fi, répétez l'appairage et suivez les instructions.", "Pour déconnecter le robot du réseau, maintenez le bouton de réinitialisation trois secondes.", "Attention : la notice indique aussi que ce même geste rétablit les paramètres d'usine.", "Prévenez donc toujours le client avant, pour qu'il sache ce qu'il va perdre."], "m3_s7": ["Ce qu'il faut retenir du chapitre deux.", "Un : uniquement du Wi-Fi deux virgule quatre gigahertz.", "Deux : on scanne le code QR du robot dans l'application Dreamehome.", "Trois : le voyant Wi-Fi vous dit où en est la connexion.", "Et quatre : en cas de blocage, on vérifie le mot de passe, le signal, puis on relance l'application."], "m4_s1": ["Chapitre trois : l'entretien.", "Un robot bien entretenu garde ses performances, et c'est aussi le meilleur moyen d'éviter les pannes.", "On voit ce que l'utilisateur peut faire seul, et ce qui relève du SAV."], "m4_s2": ["Comment savoir qu'un entretien est nécessaire ?", "Le robot vous le dit, il faut juste savoir l'écouter.", "Un bruit qui augmente.", "Une odeur qui s'installe : c'est souvent le réservoir d'eau sale.", "Un robot qui patine, ou qui s'écarte de son itinéraire.", "Ou une station qui ne vide plus le bac à poussière.", "Dans tous ces cas, direction le tableau d'entretien."], "m4_s3": ["Voici le calendrier à retenir.", "Après chaque utilisation : le réservoir d'eau sale et la brosse de nettoyage des plinthes.", "Toutes les deux semaines : le réservoir d'eau propre, les brosses, le filtre du bac à poussière et les plateaux de serpillière.", "Tous les un à deux mois : le filtre de la planche à laver.", "Tous les six mois : le module de chauffage.", "Et une fois par mois : les capteurs, les contacts de charge, les évents et les roues.", "La notice précise que ces fréquences dépendent de l'usage."], "m4_s4": ["Premier bloc : ce que l'utilisateur fait lui-même.", "Le filtre et le bac à poussière : rincez-les uniquement à l'eau claire, sans détergent, sans brosse ni objet pointu, et remontez-les seulement quand ils sont complètement secs.", "Pour les brosses principales et la brosse latérale, retirez les cheveux et les poils emmêlés, puis remettez-les en place jusqu'au clic.", "Soyez prudent en retirant les brosses : on peut se blesser."], "m4_s5": ["Deuxième bloc, le circuit d'eau.", "Videz et rincez le réservoir d'eau sale après chaque utilisation, en ménageant la boule flottante, qui est fragile.", "Rincez aussi le filtre de la planche à laver.", "Attention, le module de chauffage peut rester chaud : attendez qu'il refroidisse.", "Côté consommables, les serpillières se changent tous les un à trois mois, et le sac à poussière tous les deux à quatre mois."], "m4_s6": ["Troisième bloc : les capteurs.", "Une fois par mois, essuyez avec un chiffon doux et sec les capteurs du robot, la fenêtre du pare-chocs et la lumière d'éclairage.", "Même chose pour les contacts de charge, les évents de vidage et la zone d'émission du signal de la station.", "Jamais de chiffon humide, qui peut abîmer les éléments sensibles.", "Pour la roue omnidirectionnelle, rincez-la sous l'eau courante et remettez-la quand elle est complètement sèche."], "m4_s7": ["Les erreurs à éviter, ce sont des classiques.", "Un chiffon humide sur le robot ou la station.", "Du détergent sur le filtre.", "De l'eau chaude ou un désinfectant dans le réservoir d'eau propre.", "Un outil tranchant ou un produit corrosif sur le module de chauffage.", "Des pièces remontées encore humides.", "Et oublier de débrancher la fiche avant un entretien."], "m4_s8": ["Qui fait quoi ?", "L'utilisateur peut réaliser tout l'entretien courant : vider, rincer, essuyer, changer les consommables.", "En revanche, certaines opérations relèvent du SAV : le remplacement de la batterie, réservé à une personne qualifiée, un cordon d'alimentation endommagé, ou un problème qui persiste après les vérifications de base.", "On ne démonte jamais la batterie ni la station soi-même.", "Et si le robot reste longtemps inutilisé : charge complète, extinction, rangement au sec, et recharge au moins tous les trois mois."], "m4_s9": ["Ce qu'il faut retenir du chapitre trois.", "Un : on vide le réservoir d'eau sale après chaque utilisation.", "Deux : bac, filtre et brosses, toutes les deux semaines, à l'eau claire uniquement.", "Trois : chiffon sec pour les capteurs, jamais humide.", "Et quatre : batterie et cordon abîmé, c'est pour le SAV."], "m5_s1": ["Chapitre quatre : la FAQ.", "Dix questions que vos clients vont vous poser, avec la réponse simple à leur donner.", "Elles viennent toutes de la FAQ officielle du site d'assistance Dreame."], "m5_s2": ["Question un : pourquoi le robot hoche-t-il la tête quand il s'arrête ?", "Rassurez le client : c'est normal. Ce petit mouvement sert à repérer les obstacles avec précision et à garder le robot stable.", "Si cela se répète souvent, on redémarre le robot ; sinon, on contacte le service client.", "Question deux : le robot vibre et frotte pendant la recharge.", "C'est normal aussi : pour mieux se recharger, les roues motrices frottent contre le socle de la station. Cela n'a aucun effet sur l'utilisation."], "m5_s3": ["Question trois : le ventilateur de refroidissement est bruyant.", "C'est normal dans les modes autonomie illimitée et charge onze ampères : la batterie chauffe, alors le ventilateur tourne vite pour évacuer la chaleur.", "Question quatre : les contacts de charge noircissent ou jaunissent.", "Là encore, c'est normal : l'argent des électrodes réagit à l'air ambiant, sans conséquence sur l'utilisation.", "En revanche, si le robot ne charge pas, vérifiez que l'autocollant de l'électrode de charge a bien été retiré."], "m5_s4": ["Question cinq : un fil ou un câble bloque le bras d'extension.", "Dans l'application, ouvrez Paramètres, Fonctions auxiliaires, puis Entretien de l'équipement. Déployez l'extension au maximum, et retirez l'obstacle à la main.", "Et si le bras ne se rétracte pas, utilisez l'option Réinitialiser la serpillière, puis Rétracter.", "Question six : la serpillière s'enroule autour des cheveux.", "Activez le mode serpillière après aspiration pour limiter l'emmêlement, ou retirez la serpillière et nettoyez-la à la main."], "m5_s5": ["Question sept : le robot ne passe pas sous un meuble bas.", "Sa hauteur est d'environ quatre-vingt-neuf millimètres. Si l'espace est suffisant, activez le mode Couverture extrême, ou ajoutez des zones de faible hauteur dans l'édition de la carte.", "Question huit : le robot ne franchit pas un seuil.", "Il passe en général les marches simples de moins de cinquante-deux millimètres. Vérifiez aussi si la marche est noire ou foncée.", "Entre cinquante-deux et cent millimètres, on conseille un tapis d'escalade."], "m5_s6": ["Question neuf : il reste des traces d'eau après le passage du robot.", "Un peu d'humidité reste toujours, puis elle s'évapore. Pour limiter les traces, baissez le débit d'eau, contrôlez le disque de nettoyage, et changez régulièrement la serpillière.", "Question dix : le robot ne détecte pas une tache ou des poils.", "Activez la reconnaissance par amélioration de la lumière et le Boost des grosses particules, et mettez à jour le firmware. En cas de fausse détection, utilisez Signaler une erreur.", "Et en cas de doute ou de panne persistante, contactez le SAV."], "intro_quiz": ["Place au quiz final !", "Dix questions, quatre propositions chacune, une seule bonne réponse.", "Après chaque réponse, je vous donne la correction détaillée.", "Trois questions sur la mise en service, trois sur le Wi-Fi, deux sur l'entretien et deux sur la FAQ.", "Prenez votre temps, et bonne chance."], "q1": ["Question 1, mise en service.", "Où faut-il installer la station d'accueil ?"], "a1": ["La bonne réponse est la B : Dans un endroit dégagé, avec un bon signal Wi-Fi, idéalement sur carrelage ou marbre."], "q2": ["Question 2, mise en service.", "Que peut-on verser dans le réservoir d'eau propre ?"], "a2": ["La bonne réponse est la D : De l'eau propre et la solution de nettoyage agréée uniquement."], "q3": ["Question 3, mise en service.", "Comment allume-t-on le robot ?"], "a3": ["La bonne réponse est la A : Un appui de 3 secondes sur le bouton d'alimentation."], "q4": ["Question 4, connexion wi-fi.", "Quel réseau Wi-Fi le robot reconnaît-il ?"], "a4": ["La bonne réponse est la C : Uniquement le réseau 2,4 GHz."], "q5": ["Question 5, connexion wi-fi.", "Comment ajoute-t-on le robot dans l'application Dreamehome ?"], "a5": ["La bonne réponse est la B : En scannant le code QR situé sous le couvercle du robot."], "q6": ["Question 6, connexion wi-fi.", "Le voyant Wi-Fi clignote rapidement.", "Que signifie-t-il ?"], "a6": ["La bonne réponse est la C : La connexion est en cours."], "q7": ["Question 7, entretien.", "Que faut-il nettoyer après chaque utilisation ?"], "a7": ["La bonne réponse est la D : Le réservoir d'eau sale et la brosse de nettoyage des plinthes."], "q8": ["Question 8, entretien.", "Comment nettoyer le filtre du bac à poussière ?"], "a8": ["La bonne réponse est la A : Le rincer à l'eau claire sans détergent, puis le sécher complètement."], "q9": ["Question 9, FAQ.", "Votre client s'inquiète : son robot hoche la tête à chaque arrêt. Que lui répondez-vous ?"], "a9": ["La bonne réponse est la C : C'est normal : ce mouvement sert à repérer précisément les obstacles."], "q10": ["Question 10, FAQ.", "Un câble est coincé dans le bras d'extension du robot. Que faire ?"], "a10": ["La bonne réponse est la B : Déployer l'extension au maximum depuis l'appli, puis retirer l'obstacle à la main."], "res": ["Quiz terminé !", "Consultez votre score à l'écran.", "Si certaines notions vous ont posé problème, n'hésitez pas à revenir sur le chapitre correspondant, puis à retenter le quiz."], "concl": ["Bravo, vous avez terminé ce module !", "Vous savez maintenant installer, connecter et entretenir le Dreame X60 Pro Ultra Complete, et répondre aux questions de vos clients.", "Et si une situation dépasse ces vérifications de base, pensez au SAV : les centres d'appels, les comptoirs SAV en magasin et les ateliers SAV Fnac Darty sont là pour prendre le relais.", "Merci, et à très bientôt !"]};const AF={"home": "VO_01_INTRO_Bienvenue", "m1_s1": "VO_02_INTRO_Presentation_produit", "m1_s2": "VO_03_INTRO_Objectifs", "m1_s3": "VO_04_INTRO_Programme", "m2_s1": "VO_06_CH1_Deballage_controle", "m2_s2": "VO_10_CH1_Consignes_securite", "m2_s3": "VO_12_CH1_Premiere_mise_sous_tension", "m2_s3v": "VO_12b_CH1_Extrait_mise_sous_tension", "m2_s4": "VO_15_CH1_Cycle_nettoyage", "m2_s5": "VO_16_CH1_A_retenir", "m2_s2v": "VO_07_CH1_Extrait_video", "m3_s1": "VO_17_CH2_Titre", "m3_s2": "VO_18_CH2_Prerequis_reseau", "m3_s3": "VO_19_CH2_Application", "m3_s3v": "VO_19b_CH2_Extrait_application", "m3_s4": "VO_21_CH2_Validation_voyant_wifi", "m3_s5": "VO_22_CH2_Depannage_wifi", "m3_s6": "VO_23_CH2_Reinitialiser_wifi", "m3_s7": "VO_24_CH2_A_retenir", "m4_s1": "VO_25_CH3_Titre", "m4_s2": "VO_26_CH3_Signaux_alerte", "m4_s3": "VO_27_CH3_Frequences", "m4_s4": "VO_28_CH3_Bac_filtre_brosses", "m4_s5": "VO_29_CH3_Eau_serpilleres_chauffage", "m4_s6": "VO_30_CH3_Capteurs_contacts_roues", "m4_s7": "VO_31_CH3_Erreurs_a_eviter", "m4_s8": "VO_32_CH3_Utilisateur_ou_SAV", "m4_s9": "VO_33_CH3_A_retenir", "m5_s1": "VO_34_CH4_Intro_FAQ", "m5_s2": "VO_35_CH4_FAQ_01_02", "m5_s3": "VO_36_CH4_FAQ_03_04", "m5_s4": "VO_37_CH4_FAQ_05_06", "m5_s5": "VO_38_CH4_FAQ_07_08", "m5_s6": "VO_39_CH4_FAQ_09_10", "intro_quiz": "VO_40_CH5_Intro_quiz", "q1": "VO_41_CH5_Quiz_Q01", "a1": "VO_42_CH5_Quiz_C01", "q2": "VO_43_CH5_Quiz_Q02", "a2": "VO_44_CH5_Quiz_C02", "q3": "VO_45_CH5_Quiz_Q03", "a3": "VO_46_CH5_Quiz_C03", "q4": "VO_47_CH5_Quiz_Q04", "a4": "VO_48_CH5_Quiz_C04", "q5": "VO_49_CH5_Quiz_Q05", "a5": "VO_50_CH5_Quiz_C05", "q6": "VO_51_CH5_Quiz_Q06", "a6": "VO_52_CH5_Quiz_C06", "q7": "VO_53_CH5_Quiz_Q07", "a7": "VO_54_CH5_Quiz_C07", "q8": "VO_55_CH5_Quiz_Q08", "a8": "VO_56_CH5_Quiz_C08", "q9": "VO_57_CH5_Quiz_Q09", "a9": "VO_58_CH5_Quiz_C09", "q10": "VO_59_CH5_Quiz_Q10", "a10": "VO_60_CH5_Quiz_C10", "res": "VO_61_CH5_Resultat", "concl": "VO_62_CONCL_Conclusion_SAV"};const QUIZ_FR=[{"q": "Où faut-il installer la station d'accueil ?", "o": ["Dans la salle de bain, près de la baignoire", "Dans un endroit dégagé, avec un bon signal Wi-Fi, idéalement sur carrelage ou marbre", "Sur un tapis épais, pour amortir les vibrations", "Contre un radiateur, pour sécher plus vite les serpillières"], "ok": [1], "multi": false, "w": "La station a besoin d'espace libre autour d'elle et d'un bon signal Wi-Fi. Le carrelage ou le marbre évitent de mouiller parquets et tapis. On évite les salles de bain, les abords de piscine et les sources de chaleur.", "rev": "Chapitre 1 · Mise en service"}, {"q": "Que peut-on verser dans le réservoir d'eau propre ?", "o": ["De l'eau chaude, pour laver plus efficacement", "De l'eau avec un peu d'alcool", "De l'eau avec un désinfectant", "De l'eau propre et la solution de nettoyage agréée uniquement"], "ok": [3], "multi": false, "w": "Seules l'eau propre et la solution agréée sont autorisées : pas d'alcool, pas de désinfectant. Et surtout pas d'eau chaude, qui pourrait déformer le réservoir.", "rev": "Chapitre 1 · Mise en service"}, {"q": "Comment allume-t-on le robot ?", "o": ["Un appui de 3 secondes sur le bouton d'alimentation", "Un appui bref sur le bouton d'alimentation", "Un appui de 10 secondes sur le bouton d'alimentation", "Un double appui sur le bouton de la station d'accueil"], "ok": [0], "multi": false, "w": "3 secondes pour allumer, et aussi pour éteindre. 10 secondes, c'est pour forcer l'arrêt quand le robot ne répond plus. Autre option : poser le robot sur la station, il s'allume tout seul pour se charger.", "rev": "Chapitre 1 · Mise en service"}, {"q": "Quel réseau Wi-Fi le robot reconnaît-il ?", "o": ["Uniquement le réseau 5 GHz", "Indifféremment le 2,4 GHz ou le 5 GHz", "Uniquement le réseau 2,4 GHz", "Seulement un réseau sans mot de passe"], "ok": [2], "multi": false, "w": "Le robot ne prend en charge que le Wi-Fi 2,4 GHz. Si le client a un réseau 5 GHz, il faut relier le robot à une connexion 2,4 GHz.", "rev": "Chapitre 2 · Connexion Wi-Fi"}, {"q": "Comment ajoute-t-on le robot dans l'application Dreamehome ?", "o": ["En recherchant le robot en Bluetooth", "En scannant le code QR situé sous le couvercle du robot", "En saisissant le numéro de série à la main", "En approchant le téléphone du robot en NFC"], "ok": [1], "multi": false, "w": "Dans l'application, on touche « Scannez le code QR pour vous connecter », puis on scanne le code QR du robot, sous le couvercle. Ensuite, on suit les messages à l'écran.", "rev": "Chapitre 2 · Connexion Wi-Fi"}, {"q": "Le voyant Wi-Fi clignote rapidement. Que signifie-t-il ?", "o": ["Le robot est connecté", "Le robot est prêt à être connecté", "La connexion est en cours", "Le robot signale une erreur"], "ok": [2], "multi": false, "w": "Clignotement lent : le robot est prêt à être connecté. Clignotement rapide : connexion en cours. Voyant allumé : le robot est connecté.", "rev": "Chapitre 2 · Connexion Wi-Fi"}, {"q": "Que faut-il nettoyer après chaque utilisation ?", "o": ["Le filtre de la planche à laver", "Les plateaux de serpillière", "Le filtre du bac à poussière", "Le réservoir d'eau sale et la brosse de nettoyage des plinthes"], "ok": [3], "multi": false, "w": "Après chaque utilisation, on nettoie le réservoir d'eau sale et la brosse de nettoyage des plinthes. Les plateaux de serpillière et le filtre du bac se nettoient toutes les deux semaines, et le filtre de la planche à laver tous les un à deux mois.", "rev": "Chapitre 3 · Entretien"}, {"q": "Comment nettoyer le filtre du bac à poussière ?", "o": ["Le rincer à l'eau claire sans détergent, puis le sécher complètement", "Le brosser avec du détergent", "Le rincer avec du détergent doux, puis le remonter humide", "Le remplacer après chaque utilisation"], "ok": [0], "multi": false, "w": "Le filtre se rince uniquement à l'eau claire : ni détergent, ni brosse, ni objet pointu. Et on le remonte seulement quand il est complètement sec.", "rev": "Chapitre 3 · Entretien"}, {"q": "Votre client s'inquiète : son robot hoche la tête à chaque arrêt. Que lui répondez-vous ?", "o": ["C'est une panne : il faut le renvoyer au SAV", "La batterie est défectueuse : il faut la remplacer", "C'est normal : ce mouvement sert à repérer précisément les obstacles", "Il faut réinitialiser le robot aux paramètres d'usine"], "ok": [2], "multi": false, "w": "C'est un fonctionnement normal : ce mouvement sert à repérer les obstacles avec précision et à garder le robot stable. Si cela se répète souvent, on redémarre le robot. Et si cela persiste, on contacte le service client Dreame.", "rev": "Chapitre 4 · FAQ"}, {"q": "Un câble est coincé dans le bras d'extension du robot. Que faire ?", "o": ["Tirer fort sur le câble", "Déployer l'extension au maximum depuis l'appli, puis retirer l'obstacle à la main", "Réinitialiser le Wi-Fi du robot", "Changer la serpillière"], "ok": [1], "multi": false, "w": "Dans l'application, on ouvre Paramètres, Fonctions auxiliaires, puis Entretien de l'équipement : on déploie l'extension au maximum, puis on retire l'obstacle à la main. Pour éviter cela, on range câbles, chiffons et jouets avant le nettoyage.", "rev": "Chapitre 4 · FAQ"}];;const SEG_PT={"home": ["Olá, e bem-vindos a este módulo da Academia Fnac Darty.", "Hoje vamos descobrir, em conjunto, o robô aspirador e esfregão Dreame X60 Pro Ultra Complete: como o colocar em funcionamento, ligá-lo à rede, fazer a sua manutenção e responder às perguntas dos seus clientes.", "Fique à vontade, vamos passo a passo."], "m1_s1": ["O Dreame X60 Pro Ultra Complete é um robô que aspira e lava, acompanhado de uma estação base que faz quase todo o trabalho por si.", "A estação esvazia automaticamente o depósito de pó, lava e seca os panos de limpeza, e enche o depósito de água do robô.", "O robô deteta os obstáculos graças à visão binocular, e comanda-se através da aplicação Dreamehome, ou até por voz."], "m1_s2": ["Neste módulo, temos quatro objetivos.", "Um: instalar e colocar o robô em funcionamento logo após a receção.", "Dois: ligá-lo ao Wi-Fi sem stress.", "Três: fazer a manutenção corrente e saber quando recorrer ao serviço pós-venda.", "E quatro: responder às perguntas mais frequentes.", "No final, um quiz de dez perguntas permite-lhe validar os seus conhecimentos."], "m1_s3": ["O percurso decorre em cinco etapas: a colocação em funcionamento, a ligação Wi-Fi, a manutenção, a FAQ e, por fim, o quiz final.", "Conte com cerca de vinte minutos no total.", "Pode fazer uma pausa entre dois capítulos e voltar atrás sempre que quiser.", "Vamos a isso!"], "m2_s1": ["Começamos por abrir a caixa.", "Retire os elementos um a um e compare-os com a lista impressa na embalagem: o robô, a estação base, o respetivo cabo de alimentação, os panos de limpeza, as escovas e a solução de limpeza.", "Verifique depois o estado geral: sem sinais de pancadas, sem peças partidas, sem cabo danificado.", "E guarde a embalagem original, pois será útil para transportar o robô."], "m2_s2": ["Algumas normas de segurança que tem mesmo de conhecer.", "Utilize o robô apenas entre zero e quarenta graus.", "Não o levante nem o retire da estação enquanto estiver a funcionar.", "Mantenha crianças e animais afastados.", "No depósito, deite apenas água limpa e a solução aprovada: nunca álcool nem desinfetante.", "Não aspire objetos duros ou cortantes.", "E se o cabo estiver danificado, pare tudo e contacte o serviço pós-venda."], "m2_s3": ["Primeira colocação sob tensão.", "Coloque o robô na estação, com os panos de limpeza virados para a tábua de lavagem.", "Uma notificação por voz confirma que a ligação está correta, e o robô inicia o carregamento.", "Caso contrário, mantenha premido o botão de alimentação durante três segundos.", "Conselho do fabricante: carregue totalmente o robô antes da primeira utilização."], "m2_s3v": ["Colocamos o robô na estação.", "Um anúncio por voz confirma o carregamento.", "Antes da primeira limpeza, verifique se o robô sai bem da estação, para sua segurança e para o bom funcionamento.", "Arrume os objetos frágeis, valiosos, perigosos ou fáceis de entornar, e liberte o máximo de espaço!", "Depois de configurar a rede, siga as instruções da aplicação para criar rapidamente um mapa.", "O robô faz o mapeamento sem limpar.", "Assim que o mapa estiver concluído, pode definir zonas de acordo com a disposição da sua casa.", "Por exemplo, para os móveis, os tapetes ou as paredes virtuais.", "Se a sua casa tiver vários pisos, utilize a gestão multipisos da aplicação.", "Coloque o robô no piso pretendido quando estiver em modo de espera, e não durante uma limpeza.", "Não é preciso mudar a estação de sítio: basta criar um novo mapa.", "Nas limpezas seguintes, coloque diretamente o robô no piso pretendido.", "Ele reconhece então o mapa sozinho e regressa ao ponto de partida no fim da tarefa."], "m2_s4": ["Vejamos o que acontece durante uma limpeza.", "Para que o robô encontre facilmente a sua estação, inicie-o a partir da estação.", "Os panos de limpeza são lavados antes da partida e, depois, regularmente durante a limpeza.", "No final, a estação esvazia o depósito de pó, depois lava e seca os panos de limpeza.", "Atenção: não mude a estação nem os depósitos de sítio durante a utilização e não toque na saída de água, que pode estar quente."], "m2_s5": ["O que deve reter do capítulo um.", "Primeiro: uma estação bem posicionada, desimpedida, com Wi-Fi.", "Segundo: a segurança em primeiro lugar, utilização em interiores entre zero e quarenta graus, crianças e animais afastados.", "Terceiro: água limpa e não quente, e apenas a solução aprovada.", "E quarto: carrega-se o robô antes da primeira utilização.", "Rumo ao Wi-Fi!"], "m2_s2v": ["Vejamos em conjunto o vídeo oficial da Dreame, desde a caixa até ao arranque do robô.", "Abrimos a caixa exterior e retiramos todos os acessórios.", "Comparamos com a lista para confirmar que não falta nada: robô, estação e placa da rampa, escovas, panos de limpeza, depósito, sacos e solução.", "Em seguida, retiramos todas as películas e proteções de transporte da estação.", "Dedique o tempo necessário para remover tudo, tanto na porta como no interior.", "Instale a estação num local desimpedido, com bom sinal Wi-Fi, de preferência sobre ladrilho ou mármore.", "Deixe um metro à frente da estação, cinco centímetros de cada lado, e nada nas zonas a cinzento.", "Verifique se o filtro da tábua de lavagem está bem instalado.", "Coloque a placa de extensão da rampa.", "Encaixe firmemente o cabo de alimentação e ligue-o à tomada.", "O indicador luminoso da estação deve acender.", "Passemos à solução de limpeza: retire o compartimento da solução automática.", "Abra a tampa do módulo de enchimento e deite a solução oficial Dreame.", "Feche a tampa, volte a colocar o módulo no lugar e instale a tampa do depósito.", "O enchimento passa a ser automático.", "Retire o depósito de água limpa, encha-o, sobretudo sem água quente, e volte a colocá-lo.", "Agora, o robô. Retire as películas e as fitas de proteção.", "Para o ligar, prima o botão de alimentação durante três segundos.", "O indicador acende: o robô está ligado.", "Vire depois o robô ao contrário e fixe os panos de limpeza nos respetivos suportes.", "E está pronta a preparação!"], "m3_s1": ["Capítulo dois: a ligação ao Wi-Fi.", "É muitas vezes aqui que os clientes encravam, por isso vamos ver o método e, sobretudo, as armadilhas a evitar."], "m3_s2": ["Antes de começar, três requisitos.", "Um telemóvel ligado ao seu router.", "A palavra-passe do Wi-Fi à mão.", "E uma boa cobertura Wi-Fi no local onde está a estação.", "Acima de tudo, retenha isto: o robô só reconhece a rede de dois vírgula quatro gigahertz.", "A rede de cinco gigahertz não é suportada.", "Se o router junta as duas bandas sob o mesmo nome, lembre-se de as separar."], "m3_s3": ["Instale a aplicação Dreamehome.", "Procure-a na loja de aplicações do seu telemóvel, ou digitalize o código QR situado debaixo da tampa do robô.", "Se for a sua primeira utilização, crie uma conta de acordo com as indicações no ecrã.", "Uma pequena precisão: a aplicação evolui regularmente, pelo que os ecrãs podem ser ligeiramente diferentes dos do manual.", "Siga sempre as instruções da versão atual."], "m3_s3v": ["Abrimos a tampa do robô e digitalizamos o código QR com o telemóvel.", "Caso contrário, procure Dreamehome na App Store ou no Google Play, e depois descarregue e instale a aplicação.", "Abra a aplicação.", "Depois de iniciar sessão, toque na opção para digitalizar o código QR de ligação,", "e digitalize de novo o código QR do robô para adicionar o aparelho.", "Se preferir, adicione-o manualmente e escolha o seu modelo na lista.", "Conclua a ligação de acordo com as indicações da aplicação.", "O indicador do robô pisca lentamente: está em modo de emparelhamento de rede. A rede tem de ser de dois vírgula quatro gigahertz.", "Depois de a ligação ser bem-sucedida, personalize as definições a partir da aplicação.", "Não se esqueça de atualizar o firmware para a versão mais recente.", "Na primeira utilização, o robô limpa por predefinição em modo de aspiração e lavagem.", "Pode depois escolher o modo pretendido: potência de aspiração, humidade do pano e outras definições na aplicação.", "Toque no ícone das definições, em cima à direita, para aceder a outras opções.", "Se tiver um animal de estimação, ative o modo animais de estimação.", "Para começar, inicie a limpeza a partir da aplicação ou prima brevemente o botão de alimentação do robô.", "Ele limpa de acordo com o percurso ideal calculado com base no mapa.", "Pelo caminho, volta para lavar o pano, de acordo com as suas definições de lavagem.", "De regresso à estação, enche-se de água automaticamente e retoma depois a limpeza.", "Terminada a tarefa, regressa para carregar, e a estação esvazia o pó, lava e seca o pano.", "Durante a lavagem, não mude de sítio a estação, nem o depósito, nem a tábua de lavagem.", "Depois, lembre-se de limpar o depósito de água suja, para evitar maus odores.", "Siga estes passos e desfrute de uma limpeza sem esforço com o seu robô Dreame!"], "m3_s4": ["Para saber em que ponto está a ligação, observe o indicador Wi-Fi.", "Se piscar lentamente: o robô está pronto para ser ligado.", "Se piscar rapidamente: a ligação está em curso.", "Se ficar aceso: o robô está ligado.", "Para validar, verifique se o robô aparece na aplicação e inicie o mapeamento rápido: o robô explora a casa sem limpar, e o mapa é guardado automaticamente quando regressa à estação."], "m3_s5": ["O robô não se liga?", "Analise as quatro causas mais frequentes.", "Palavra-passe incorreta: volte a introduzi-la com cuidado.", "Rede de cinco gigahertz: mude para a de dois vírgula quatro.", "Sinal demasiado fraco: verifique se o robô está numa zona bem coberta.", "E robô não pronto: feche completamente a aplicação, volte a abri-la e recomece o procedimento."], "m3_s6": ["Precisa de recomeçar do zero?", "Para reconfigurar o Wi-Fi, repita o emparelhamento e siga as instruções.", "Para desligar o robô da rede, mantenha premido o botão de reposição durante três segundos.", "Atenção: o manual indica também que este mesmo gesto repõe as definições de fábrica.", "Avise, por isso, sempre o cliente antes, para que ele saiba o que vai perder."], "m3_s7": ["O que deve reter do capítulo dois.", "Um: apenas Wi-Fi de dois vírgula quatro gigahertz.", "Dois: digitaliza-se o código QR do robô na aplicação Dreamehome.", "Três: o indicador Wi-Fi diz-lhe em que ponto está a ligação.", "E quatro: em caso de bloqueio, verifica-se a palavra-passe, o sinal e reinicia-se a aplicação."], "m4_s1": ["Capítulo três: a manutenção.", "Um robô bem cuidado mantém o seu desempenho, e é também a melhor forma de evitar avarias.", "Vamos ver o que o utilizador pode fazer sozinho e o que é da responsabilidade do serviço pós-venda."], "m4_s2": ["Como saber se é necessária uma manutenção?", "O robô diz-lhe, basta saber ouvi-lo.", "Um ruído que aumenta.", "Um cheiro que se instala: muitas vezes é o depósito de água suja.", "Um robô que derrapa ou que se desvia do seu percurso.", "Ou uma estação que deixa de esvaziar o depósito de pó.", "Em todos estes casos, consulte o quadro de manutenção."], "m4_s3": ["Eis o calendário a reter.", "Após cada utilização: o depósito de água suja e a escova de limpeza dos rodapés.", "De duas em duas semanas: o depósito de água limpa, as escovas, o filtro do depósito de pó e os suportes dos panos de limpeza.", "A cada um a dois meses: o filtro da tábua de lavagem.", "De seis em seis meses: o módulo de aquecimento.", "E uma vez por mês: os sensores, os contactos de carregamento, as saídas de ar e as rodas.", "O manual precisa que estas frequências dependem da utilização."], "m4_s4": ["Primeiro bloco: o que o utilizador faz por si.", "O filtro e o depósito de pó: enxague-os apenas com água limpa, sem detergente, sem escova nem objetos pontiagudos, e volte a montá-los só quando estiverem completamente secos.", "Nas escovas principais e na escova lateral, retire os cabelos e pelos emaranhados e volte a colocá-las até ouvir o clique.", "Tenha cuidado ao retirar as escovas: pode magoar-se."], "m4_s5": ["Segundo bloco: o circuito de água.", "Esvazie e enxague o depósito de água suja após cada utilização, e tenha cuidado com a bola flutuante, que é frágil.", "Enxague também o filtro da tábua de lavagem.", "Atenção: o módulo de aquecimento pode permanecer quente, aguarde que arrefeça.", "Quanto aos consumíveis, os panos de limpeza trocam-se a cada um a três meses, e o saco de pó a cada dois a quatro meses."], "m4_s6": ["Terceiro bloco: os sensores.", "Uma vez por mês, limpe com um pano macio e seco os sensores do robô, a janela do para-choques e a luz de iluminação.", "O mesmo para os contactos de carregamento, as saídas de esvaziamento e a zona de emissão do sinal da estação.", "Nunca use um pano húmido, que pode danificar os elementos sensíveis.", "Quanto à roda omnidirecional, enxague-a em água corrente e volte a colocá-la quando estiver completamente seca."], "m4_s7": ["Os erros a evitar são clássicos.", "Um pano húmido no robô ou na estação.", "Detergente no filtro.", "Água quente ou desinfetante no depósito de água limpa.", "Uma ferramenta cortante ou um produto corrosivo no módulo de aquecimento.", "Peças montadas ainda húmidas.", "E esquecer-se de desligar a ficha antes de uma manutenção."], "m4_s8": ["Quem faz o quê?", "O utilizador pode realizar toda a manutenção corrente: esvaziar, enxaguar, limpar, trocar os consumíveis.", "Em contrapartida, algumas operações são da responsabilidade do serviço pós-venda: a substituição da bateria, reservada a uma pessoa qualificada, um cabo de alimentação danificado, ou um problema que persista após as verificações de base.", "Nunca se desmonta a bateria nem a estação por conta própria.", "E se o robô ficar muito tempo sem ser utilizado: carga completa, desligar, guardar em local seco e recarregar pelo menos de três em três meses."], "m4_s9": ["O que deve reter do capítulo três.", "Um: esvazia-se o depósito de água suja após cada utilização.", "Dois: depósito, filtro e escovas, de duas em duas semanas, apenas com água limpa.", "Três: pano seco para os sensores, nunca húmido.", "E quatro: bateria e cabo danificado, é para o serviço pós-venda."], "m5_s1": ["Capítulo quatro: a FAQ.", "Dez perguntas que os seus clientes vão fazer, com a resposta simples a dar-lhes.", "Todas provêm da FAQ oficial do site de assistência da Dreame."], "m5_s2": ["Pergunta um: porque é que o robô acena com a cabeça quando para?", "Tranquilize o cliente: é normal. Este pequeno movimento serve para detetar os obstáculos com precisão e manter o robô estável.", "Se se repetir com frequência, reinicia-se o robô; caso contrário, contacta-se o apoio ao cliente.", "Pergunta dois: o robô vibra e roça durante o carregamento.", "Também é normal: para carregar melhor, as rodas motrizes roçam na base da estação. Isto não tem qualquer efeito na utilização."], "m5_s3": ["Pergunta três: a ventoinha de arrefecimento faz muito ruído.", "É normal nos modos autonomia ilimitada e carga de onze amperes: a bateria aquece, por isso a ventoinha roda depressa para evacuar o calor.", "Pergunta quatro: os contactos de carregamento ficam pretos ou amarelados.", "Também aqui é normal: a prata dos elétrodos reage ao ar ambiente, sem consequências na utilização.", "No entanto, se o robô não carregar, verifique se o autocolante do elétrodo de carregamento foi retirado."], "m5_s4": ["Pergunta cinco: um fio ou um cabo bloqueia o braço de extensão.", "Na aplicação, abra Definições, Funções auxiliares e depois Manutenção do equipamento. Estenda a extensão ao máximo e retire o obstáculo à mão.", "E se o braço não se retrair, utilize a opção Repor pano de limpeza e depois Retrair.", "Pergunta seis: o pano de limpeza enrola-se nos cabelos.", "Ative o modo pano de limpeza após aspiração para limitar o emaranhamento, ou retire o pano e limpe-o à mão."], "m5_s5": ["Pergunta sete: o robô não passa por baixo de um móvel baixo.", "A sua altura é de cerca de oitenta e nove milímetros. Se o espaço for suficiente, ative o modo Cobertura extrema, ou adicione zonas de baixa altura na edição do mapa.", "Pergunta oito: o robô não transpõe um desnível.", "Em geral, transpõe degraus simples com menos de cinquenta e dois milímetros. Verifique também se o degrau é preto ou escuro.", "Entre cinquenta e dois e cem milímetros, aconselha-se um tapete de escalada."], "m5_s6": ["Pergunta nove: ficam marcas de água após a passagem do robô.", "Fica sempre um pouco de humidade, que depois se evapora. Para limitar as marcas, reduza o caudal de água, verifique o disco de limpeza e troque regularmente o pano de limpeza.", "Pergunta dez: o robô não deteta uma mancha ou pelos.", "Ative o reconhecimento por melhoria de luz e o Boost de partículas grandes, e atualize o firmware. Em caso de falsa deteção, utilize Comunicar um erro.", "E em caso de dúvida ou de avaria persistente, contacte o serviço pós-venda."], "intro_quiz": ["Chegou o quiz final!", "Dez perguntas, quatro propostas em cada, uma única resposta correta.", "Após cada resposta, dou-lhe a correção detalhada.", "Três perguntas sobre a colocação em funcionamento, três sobre o Wi-Fi, duas sobre a manutenção e duas sobre a FAQ.", "Tenha calma e boa sorte."], "q1": ["Pergunta 1, colocação em funcionamento.", "Onde se deve instalar a estação base?"], "a1": ["A resposta correta é a B: Num local desimpedido, com bom sinal Wi-Fi, de preferência sobre ladrilho ou mármore."], "q2": ["Pergunta 2, colocação em funcionamento.", "O que se pode deitar no depósito de água limpa?"], "a2": ["A resposta correta é a D: Apenas água limpa e a solução de limpeza aprovada."], "q3": ["Pergunta 3, colocação em funcionamento.", "Como se liga o robô?"], "a3": ["A resposta correta é a A: Premir durante 3 segundos o botão de alimentação."], "q4": ["Pergunta 4, ligação Wi-Fi.", "Que rede Wi-Fi o robô reconhece?"], "a4": ["A resposta correta é a C: Apenas a rede de 2,4 GHz."], "q5": ["Pergunta 5, ligação Wi-Fi.", "Como se adiciona o robô na aplicação Dreamehome?"], "a5": ["A resposta correta é a B: Digitalizar o código QR situado debaixo da tampa do robô."], "q6": ["Pergunta 6, ligação Wi-Fi.", "O indicador Wi-Fi pisca rapidamente.", "O que significa?"], "a6": ["A resposta correta é a C: A ligação está em curso."], "q7": ["Pergunta 7, manutenção.", "O que é preciso limpar após cada utilização?"], "a7": ["A resposta correta é a D: O depósito de água suja e a escova de limpeza dos rodapés."], "q8": ["Pergunta 8, manutenção.", "Como se limpa o filtro do depósito de pó?"], "a8": ["A resposta correta é a A: Enxaguá-lo com água limpa, sem detergente, e secá-lo completamente."], "q9": ["Pergunta 9, FAQ.", "O seu cliente está preocupado: o robô acena com a cabeça sempre que para. O que lhe responde?"], "a9": ["A resposta correta é a C: É normal: este movimento serve para detetar com precisão os obstáculos."], "q10": ["Pergunta 10, FAQ.", "Um cabo ficou preso no braço de extensão do robô. O que fazer?"], "a10": ["A resposta correta é a B: Estender a extensão ao máximo a partir da aplicação e depois retirar o obstáculo à mão."], "res": ["Quiz concluído!", "Consulte a sua pontuação no ecrã.", "Se algumas noções lhe levantaram dificuldades, não hesite em voltar ao capítulo correspondente e depois voltar a tentar o quiz."], "concl": ["Parabéns, concluiu este módulo!", "Já sabe instalar, ligar e fazer a manutenção do Dreame X60 Pro Ultra Complete, e responder às perguntas dos seus clientes.", "E se uma situação ultrapassar estas verificações de base, pense no serviço pós-venda: os centros de contacto, os balcões de pós-venda nas lojas e as oficinas de assistência técnica Fnac Darty estão lá para assumir.", "Obrigado, e até muito em breve!"]};const QUIZ_PT=[{"q": "Onde se deve instalar a estação base?", "o": ["Na casa de banho, junto à banheira", "Num local desimpedido, com bom sinal Wi-Fi, de preferência sobre ladrilho ou mármore", "Sobre um tapete grosso, para amortecer as vibrações", "Encostada a um radiador, para secar mais depressa os panos de limpeza"], "ok": [1], "multi": false, "w": "A estação precisa de espaço livre à sua volta e de um bom sinal Wi-Fi. O ladrilho ou o mármore evitam molhar pavimentos de madeira e tapetes. Evitam-se as casas de banho, as zonas junto a piscinas e as fontes de calor.", "rev": "Capítulo 1 · Colocação em funcionamento"}, {"q": "O que se pode deitar no depósito de água limpa?", "o": ["Água quente, para lavar com mais eficácia", "Água com um pouco de álcool", "Água com desinfetante", "Apenas água limpa e a solução de limpeza aprovada"], "ok": [3], "multi": false, "w": "Só são permitidas a água limpa e a solução aprovada: nada de álcool, nada de desinfetante. E sobretudo nada de água quente, que poderia deformar o depósito.", "rev": "Capítulo 1 · Colocação em funcionamento"}, {"q": "Como se liga o robô?", "o": ["Premir durante 3 segundos o botão de alimentação", "Premir brevemente o botão de alimentação", "Premir durante 10 segundos o botão de alimentação", "Premir duas vezes o botão da estação base"], "ok": [0], "multi": false, "w": "3 segundos para ligar, e também para desligar. 10 segundos serve para forçar o desligar quando o robô deixa de responder. Outra opção: colocar o robô na estação, que se liga sozinho para carregar.", "rev": "Capítulo 1 · Colocação em funcionamento"}, {"q": "Que rede Wi-Fi o robô reconhece?", "o": ["Apenas a rede de 5 GHz", "Indiferentemente a de 2,4 GHz ou a de 5 GHz", "Apenas a rede de 2,4 GHz", "Apenas uma rede sem palavra-passe"], "ok": [2], "multi": false, "w": "O robô só suporta o Wi-Fi de 2,4 GHz. Se o cliente tiver uma rede de 5 GHz, é preciso ligar o robô a uma ligação de 2,4 GHz.", "rev": "Capítulo 2 · Ligação Wi-Fi"}, {"q": "Como se adiciona o robô na aplicação Dreamehome?", "o": ["Procurar o robô por Bluetooth", "Digitalizar o código QR situado debaixo da tampa do robô", "Introduzir à mão o número de série", "Aproximar o telemóvel do robô por NFC"], "ok": [1], "multi": false, "w": "Na aplicação, toca-se em «Digitalizar o código QR para ligar» e depois digitaliza-se o código QR do robô, debaixo da tampa. Em seguida, seguem-se as mensagens no ecrã.", "rev": "Capítulo 2 · Ligação Wi-Fi"}, {"q": "O indicador Wi-Fi pisca rapidamente. O que significa?", "o": ["O robô está ligado", "O robô está pronto para ser ligado", "A ligação está em curso", "O robô assinala um erro"], "ok": [2], "multi": false, "w": "Pisca lentamente: o robô está pronto para ser ligado. Pisca rapidamente: ligação em curso. Aceso: o robô está ligado.", "rev": "Capítulo 2 · Ligação Wi-Fi"}, {"q": "O que é preciso limpar após cada utilização?", "o": ["O filtro da tábua de lavagem", "Os suportes dos panos de limpeza", "O filtro do depósito de pó", "O depósito de água suja e a escova de limpeza dos rodapés"], "ok": [3], "multi": false, "w": "Após cada utilização, limpam-se o depósito de água suja e a escova de limpeza dos rodapés. Os suportes dos panos de limpeza e o filtro do depósito limpam-se de duas em duas semanas, e o filtro da tábua de lavagem a cada um a dois meses.", "rev": "Capítulo 3 · Manutenção"}, {"q": "Como se limpa o filtro do depósito de pó?", "o": ["Enxaguá-lo com água limpa, sem detergente, e secá-lo completamente", "Escová-lo com detergente", "Enxaguá-lo com detergente suave e voltar a montá-lo húmido", "Substituí-lo após cada utilização"], "ok": [0], "multi": false, "w": "O filtro enxagua-se apenas com água limpa: nem detergente, nem escova, nem objetos pontiagudos. E só se volta a montar quando estiver completamente seco.", "rev": "Capítulo 3 · Manutenção"}, {"q": "O seu cliente está preocupado: o robô acena com a cabeça sempre que para. O que lhe responde?", "o": ["É uma avaria: tem de o enviar ao serviço pós-venda", "A bateria está com defeito: tem de ser substituída", "É normal: este movimento serve para detetar com precisão os obstáculos", "É preciso repor o robô nas definições de fábrica"], "ok": [2], "multi": false, "w": "É um funcionamento normal: este movimento serve para detetar os obstáculos com precisão e manter o robô estável. Se se repetir com frequência, reinicia-se o robô. E se persistir, contacta-se o apoio ao cliente Dreame.", "rev": "Capítulo 4 · FAQ"}, {"q": "Um cabo ficou preso no braço de extensão do robô. O que fazer?", "o": ["Puxar com força o cabo", "Estender a extensão ao máximo a partir da aplicação e depois retirar o obstáculo à mão", "Repor o Wi-Fi do robô", "Trocar o pano de limpeza"], "ok": [1], "multi": false, "w": "Na aplicação, abre-se Definições, Funções auxiliares e depois Manutenção do equipamento: estende-se a extensão ao máximo e retira-se o obstáculo à mão. Para evitar isto, arrumam-se cabos, panos e brinquedos antes da limpeza.", "rev": "Capítulo 4 · FAQ"}];const FAQV_PT=[["Porque é que o robô «acena com a cabeça» quando para?", "É normal: este pequeno movimento serve para detetar os obstáculos com precisão e manter a estabilidade. Se se repetir com frequência, reinicie o robô; caso contrário, contacte o apoio ao cliente Dreame."], ["O robô vibra e roça durante o carregamento?", "É normal: para carregar melhor, as rodas motrizes roçam na base da estação. Isto não afeta a utilização."], ["A ventoinha de arrefecimento faz muito ruído?", "Normal nos modos «autonomia ilimitada» e «carga de 11 A»: a bateria aquece e a ventoinha roda depressa para evacuar o calor."], ["Os contactos de carregamento ficam pretos ou amarelados?", "Normal: a prata dos elétrodos reage ao ar ambiente, sem efeito na utilização. O robô não carrega? Verifique se o autocolante do elétrodo de carregamento foi retirado."], ["Um fio ou um cabo bloqueia o braço de extensão?", "Aplicação: Definições › Funções auxiliares › Manutenção do equipamento. Estenda a extensão ao máximo e retire o obstáculo à mão. Braço não retraído: «Repor pano de limpeza» › Retrair."], ["O pano de limpeza enrola-se nos cabelos?", "Ative o modo «pano de limpeza após aspiração» para limitar o emaranhamento, ou retire o pano e limpe-o à mão."], ["O robô não passa por baixo de um móvel baixo?", "A sua altura é de cerca de 89 mm. Se o espaço for suficiente: modo «Cobertura extrema» ou «zonas de baixa altura» adicionadas na edição do mapa."], ["O robô não transpõe um desnível?", "Em geral, transpõe degraus simples com menos de 52 mm; verifique se o degrau é preto ou escuro. De 52 a 100 mm: tapete de escalada aconselhado."], ["Ficam marcas de água após a passagem?", "Fica um pouco de humidade, que depois se evapora. Reduza o caudal de água (32 níveis), verifique o disco de limpeza e troque regularmente o pano de limpeza."], ["O robô não deteta uma mancha ou pelos?", "Ative o reconhecimento por melhoria de luz (Funcionalidades de laboratório) e o «Boost de partículas grandes», e atualize o firmware. Falsa deteção: «Comunicar um erro»."]];/* ===== Textes de l'interface (FR / PT-PT) ===== */

/* Chronologie d'un écran : en français, les instants mesurés sur les audios ;

   (répartition des phrases au prorata de leur longueur ; extraits vidéo : proportionnelle au français). */
const TLC={};
function tm(key){
 let b=TIMES[key];if(!b)return null;
 if(isVK(key)){
  /* Extraits vidéo : instants mesurés sur l'audio de chaque langue, remis à l'échelle si l'audio déposé a une autre durée. */
  const base=(LANG!=='fr'&&PTV[key])?PTV[key]:b;
  const real=(AUD.duration&&isFinite(AUD.duration)&&ANIM.key===key&&Math.abs(AUD.duration-base.d)>0.3);
  if(!real)return base;
  const ck=key+'|'+LANG+'|'+AUD.duration.toFixed(1);if(TLC[ck])return TLC[ck];
  const f=AUD.duration/base.d;return TLC[ck]={s:base.s.map(x=>x*f),d:AUD.duration};
 }
 if(LANG==='fr')return b;
 const real=(AUD.duration&&isFinite(AUD.duration)&&ANIM.key===key);
 const ad=real?AUD.duration:b.d*(isVK(key)?1:1.12);
 const ck=key+'|'+ad.toFixed(1);if(TLC[ck])return TLC[ck];
 const segs=SEG[key]||[];let s;
 if(isVK(key)||!segs.length||segs.length!==b.s.length){const f=ad/b.d;s=b.s.map(x=>x*f)}
 else{
  const lead=Math.min(0.3,ad*0.03),tail=0.3,use=Math.max(0.5,ad-lead-tail);
  const w=segs.map(x=>x.length+6),W=w.reduce((a,c)=>a+c,0);let c=0;

 const r={s,d:ad,o:b.o?b.o.map(conv):undefined,conv};TLC[ck]=r;return r;
}

function computeT(key,items){
 const t=tm(key),S=t.s,n0=S.length,end=t.d;let T=[];

  return items.map((_,j)=>((t.o&&t.o[j]!==undefined)?t.o[j]:(S[2+j]!==undefined?S[2+j]:end))+0.1);

  if(LANG!=='fr'&&t.conv)T=T.map(x=>t.conv(x));

 }

 T=items.map((_,i)=>{
  const p=i*n0/n,k=Math.min(n0-1,Math.floor(p)),f=p-k,a=S[k],b=k+1<n0?S[k+1]:end;

}

/* Calage voix off / vidéo : chaque phrase de la voix off est reliée à l'image de la vidéo qu'elle commente (VANC).

function vmap(key,t){
 const tt=tm(key),V=VANC[key];if(!tt||!V)return null;
 const S=tt.s.concat([tt.d]);let i=0;
 while(i<S.length-2&&t>=S[i+1])i++;

    btns.forEach((x,i)=>{x.disabled=true;x.classList.remove('sel');if(ok.includes(i))x.classList.add('right');else if(sel.has(i))x.classList.add('wrong')});
    fb.className='fb show '+(good?'ok':'ko');
    fb.innerHTML=`<b>${good?okMsg:koMsg}</b> ${good?'':`${u('goodAns')} <b>${okTxt(ok)}</b>. `}${why}`;
    const v=$('.vok',box);if(v)v.style.display='none';
    onDone&&onDone(good,[...sel]);
  };
  btns.forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i;
    if(!multi){sel.add(i);done();return}
    sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel',sel.has(i));$('.vok',box).disabled=sel.size===0;
  }));
  if(multi)$('.vok',box).addEventListener('click',done);
}

/* side = colonne de droite ; mediaHtml = encadré de visionnage (toujours à gauche) ; bottom = zone pleine largeur.

const mlayout=(side,mediaHtml,bottom,mf)=>{

};

  ${mlayout(`<div class="box"><h3>Depósito de água usada</h3><ul class="l">${li([`Esvaziar e enxaguar após cada utilização`,`Bola flutuante frágil: não forçar`])}</ul></div><div class="box"><h3>Tábua de lavagem</h3><ul class="l">${li([`Enxaguar o filtro com água limpa`,`Módulo de aquecimento quente: aguardar que arrefeça`])}</ul></div><div class="box"><h3>Consumíveis</h3><ul class="l">${li([`Panos de limpeza: a cada 1 a 3 meses`,`Saco de pó: a cada 2 a 4 meses`])}</ul></div>`,loopMedia('boucle_reservoir_eau_usee.mp4','boucle_reservoir_eau_usee.jpg','Depósito de água usada',true),'',true)}`},
 {t:`Sensores, contactos e rodas`,html:()=>`

   <div class="box"><h3>Pano macio e seco</h3><ul class="l">${li([`Sensores do robô, janela do para-choques, luz de iluminação`,`Contactos de carregamento`,`Saídas de esvaziamento`,`Zona de emissão do sinal da estação`])}</ul></div>

 {t:`Erros a evitar`,html:()=>`
  <p class="kicker">Capítulo 3 · Erros a evitar</p><h2>Os erros clássicos</h2>
  ${koBox('A não fazer',[`Pano húmido no robô ou na estação`,`Detergente no filtro`,`Água quente ou desinfetante no depósito de água limpa`,`Ferramenta cortante ou produto corrosivo no módulo de aquecimento`,`Peças montadas ainda húmidas`,`Esquecer-se de desligar a ficha antes da manutenção`])}`},
 {t:`Eu ou o serviço pós-venda?`,html:()=>`
  <p class="kicker">Capítulo 3 · Eu ou o serviço pós-venda?</p><h2>O que faço eu mesmo… e o que confio ao serviço pós-venda</h2>
  <div class="grid2">

  ${infoBox('Longo período sem utilização','Carga completa, desligar, guardar em local seco e fresco e, depois, recarregar pelo menos de 3 em 3 meses.')}

]},

/* ===== Application ===== */
const app=$('#app');
const total=6;
const TOTALMIN=28;
function updTop(){
 const d=Object.keys(ST.done).length;
 $('.bar i').style.width=(d/total*100)+'%';
 $('#pg').textContent=u('pgdone',d,total);
 $$('nav.steps button').forEach((b,i)=>{b.classList.toggle('on',i-1===cur);const m=MODS[i-1];b.classList.toggle('done',!!(m&&ST.done[m.id]))});
}
function buildNav(){
 $('nav.steps .in').innerHTML=`<button data-m="-1"><span class="n">⌂</span><span class="l">${u('navHome')}<small>${u('navHomeSub')}</small></span></button>`+MODS.map((m,i)=>`<button data-m="${i}"><span class="n">${m.num}</span><span class="l">${m.short}<small>≈ ${m.min} min</small></span></button>`).join('');
 $$('nav.steps button').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.m,0)));
}
function go(m,s){cur=m;scr=s;render();window.scrollTo({top:0,behavior:'smooth'})}
function home(){
 app.innerHTML=`<div class="hero"><img src="${IMG.logo}" alt="${u('logoAlt')}"><div style="position:relative;z-index:1;padding-right:70px"><p class="kicker" style="color:var(--yellow)">${u('homeKicker')}</p><h2>${u('homeH')}</h2><p class="lead">${u('homeLead')}</p></div></div>
 <div class="path">${MODS.map((m,i)=>`<button data-m="${i}"><div class="num">${m.num}</div><b>${m.quiz?u('quizFinal'):m.title}</b><div class="mn">≈ ${m.min} min${m.quiz?u('nq'):''}${ST.done[m.id]?u('doneTag'):''}</div></button>`).join('')}</div>
 <div class="callout" style="margin-top:18px">${u('homeCall',TOTALMIN,ST.best)}</div>
 <div class="foot"><span></span><button class="btn y" id="start">${u('start')}</button></div>`;
 $$('.path button',app).forEach(b=>b.onclick=()=>go(+b.dataset.m,0));$('#start').onclick=()=>go(0,0);
}

function subsInit(root){
 (root||document).querySelectorAll('video[data-sub]').forEach(v=>{
  if(v._subs)return;v._subs=1;
  const box=v.parentNode,ov=box.querySelector('.vsub');if(!ov)return;
  const key=v.getAttribute('data-sub'),nt=box.querySelector('.vnote'),N=NOTES[key];
  if(nt&&N){nt.style.left=N.p[0]+'%';nt.style.top=N.p[1]+'%';nt.style.width=N.p[2]+'%';nt.style.height=N.p[3]+'%'}
  const upd=()=>{
   const cues=(SUBS[key]||{})[LANG]||[],t=v.currentTime||0;let txt='';
   for(let i=0;i<cues.length;i++){if(t>=cues[i][0]&&t<cues[i][1]){txt=cues[i][2];break}}
   const fs=Math.max(11,box.clientHeight*0.046)+'px';
   if(ov.style.fontSize!==fs)ov.style.fontSize=fs;
   if(ov.textContent!==txt)ov.textContent=txt;
   if(nt&&N){const on=t>=N.t[0]&&t<N.t[1];if(on){const tx=N[LANG];if(nt.textContent!==tx)nt.textContent=tx;const nf=Math.max(10,box.clientHeight*0.034)+'px';if(nt.style.fontSize!==nf)nt.style.fontSize=nf}nt.classList.toggle('on',on)}
  };
  ['timeupdate','seeked','play','pause','loadeddata','ratechange'].forEach(e=>v.addEventListener(e,upd));
  const loop=()=>{upd();if(v.isConnected)requestAnimationFrame(loop)};
  requestAnimationFrame(loop);
 });
}
function render(){
 updTop();
 if(cur<0){home();voice('home');return}
 const m=MODS[cur];
 if(m.quiz){quiz();return}
 const S=m.screens,s=S[scr];
 app.innerHTML=`<section class="screen" id="sc">${s.html()}</section><div class="foot"><button class="btn ghost" id="pv" ${scr===0&&cur===0?'disabled':''}>${u('prev')}</button><div class="dots">${S.map((_,i)=>`<i class="${i===scr?'on':i<scr?'past':''}"></i>`).join('')}</div><button class="btn y" id="nx">${scr===S.length-1?(cur<total-1?(MODS[cur+1].quiz?u('toQuiz'):u('nextCh')):u('finish')):u('next')}</button></div>`;
 s.init&&s.init($('#sc'));
 subsInit($('#sc'));
 voice('m'+m.id+'_s'+(scr+1));
 $('#pv').onclick=()=>{if(scr>0)go(cur,scr-1);else if(cur>0)go(cur-1,MODS[cur-1].screens?MODS[cur-1].screens.length-1:0);else go(-1,0)};
 $('#nx').onclick=()=>{
  if(scr<S.length-1)go(cur,scr+1);
  else{ST.done[m.id]=1;save();go(cur+1,0)}
 };
 if(scr===S.length-1){ST.done[m.id]=1;updTop()}
 save();
}
function quiz(){
 let i=0,sc=0;const miss=[];
 const intro=()=>{
  voice('intro_quiz');
  app.innerHTML=`<section class="screen" id="sc"><p class="kicker">${u('qKick')}</p><h2>${u('qH')}</h2>
  <div class="grid2" style="align-items:start">${okBox(u('qPrinc'),u('qPrincL'))}${card(u('qRepT'),u('qRepP'))}</div>
  <div class="callout" style="margin-top:14px">${u('qPass')}</div></section>
  <div class="foot"><button class="btn ghost" id="pv">${u('prev')}</button><span></span><button class="btn y" id="go">${u('qBegin')}</button></div>`;
  $('#pv').onclick=()=>go(cur-1,MODS[cur-1].screens.length-1);
  $('#go').onclick=()=>{i=0;sc=0;miss.length=0;draw()};
 };
 const draw=()=>{
  if(i>=QUIZ.length)return result();
  const q=QUIZ[i];voice('q'+(i+1));
  app.innerHTML=`<section class="screen"><p class="kicker">${u('qHead',i+1,QUIZ.length,q.rev)}</p><div class="qbar"><i style="width:${i/QUIZ.length*100}%"></i></div><h2 style="font-size:24px">${q.q}</h2><p class="cap" style="margin:-6px 0 6px">${u('qOne')}</p><div id="qq"></div></section>`;
  mcq($('#qq'),{opts:q.o,ok:q.ok,multi:q.multi,why:q.w,onDone:g=>{if(g)sc++;else miss.push(i);voice('a'+(i+1));const b=document.createElement('button');b.className='btn y';b.style.marginTop='14px';b.textContent=i+1<QUIZ.length?u('qNext'):u('qResult');b.onclick=()=>{i++;draw()};$('#qq').appendChild(b);b.focus()}});
 };
 const concl=()=>{
  voice('concl');
  app.innerHTML=`<section class="screen" id="sc"><p class="kicker">${u('conKick')}</p><h2>${u('conH')}</h2>
  <div class="grid3" style="text-align:left;margin:16px 0">${okBox(u('conA'),u('conAL'))}${warnBox(u('conB'),u('conBL'))}${koBox(u('conC'),u('conCL'))}</div>
  <div class="box key" style="text-align:left"><h3>${u('conHelp')}</h3><ul class="l">${u('conHelpL').map(x=>`<li>${x}</li>`).join('')}</ul></div></section>
  <div class="foot"><button class="btn ghost" id="rv">${u('review')}</button><span></span><button class="btn y" id="rt">${u('retry')}</button></div>`;
  $('#rv').onclick=()=>go(-1,0);$('#rt').onclick=()=>go(total-1,0);
 };
 const result=()=>{
  const pass=sc>=8;if(ST.best==null||sc>ST.best)ST.best=sc;if(pass)ST.done[MODS[total-1].id]=1;save();SC.result(sc,pass);updTop();voice('res');
  app.innerHTML=`<section class="screen" style="text-align:center"><p class="kicker">${u('resKick')}</p><div class="score" style="color:${pass?'var(--green)':'var(--red)'}">${sc}/10</div><h2 style="margin-top:10px">${pass?u('resOk'):u('resKo')}</h2><p class="lead">${pass?u('resLeadOk'):u('resLeadKo')}</p>
  ${miss.length?`<div class="box" style="text-align:left;margin:16px 0"><h3>${u('resMiss')}</h3><ul class="l">${miss.map(k=>`<li><b>Q${k+1} · ${QUIZ[k].rev}</b><br>${QUIZ[k].q}<br><span style="color:var(--green)">✓ ${QUIZ[k].ok.map(j=>QUIZ[k].o[j]).join(' · ')}</span></li>`).join('')}</ul></div>`:''}
  <div class="foot" style="justify-content:center"><button class="btn ghost" id="rv">${u('review')}</button><button class="btn ${pass?'ghost':'y'}" id="rt">${u('retry')}</button>${pass?`<button class="btn y" id="cc">${u('toConcl')}</button>`:''}</div></section>`;
  $('#rv').onclick=()=>go(-1,0);$('#rt').onclick=()=>go(total-1,0);if(pass)$('#cc').onclick=concl;
 };
 intro();
}

/* ===== Bascule de langue FR / PT-PT ===== */
const NARR_OF=s=>Object.fromEntries(Object.entries(s).map(([k,v])=>[k,v.join(' ')]));
function applyLang(l){
 LANG=l==='pt'?'pt':'fr';
 if(LANG==='pt'){SEG=SEG_PT;NARR=NARR_OF(SEG_PT);QUIZ=QUIZ_PT;FAQV=FAQV_PT;MODS=MODS_PT}
 else{SEG=SEG_FR;NARR=NARR_FR;QUIZ=QUIZ_FR;FAQV=FAQV_FR;MODS=MODS_FR}
 const tag=LANG==='pt'?'pt-PT':'fr-FR';
 document.documentElement.lang=tag;app.setAttribute('lang',tag);
 document.title=u('title');
 $('#hsub').textContent=u('sub');$('#hlogo').alt=u('logoAlt');$('#vsum').textContent=u('transcript');$('#foot').textContent=u('footer');
 $('.lang').setAttribute('aria-label',u('langLabel'));
 $$('.lang button').forEach(b=>{const on=b.dataset.l===LANG;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
 try{localStorage.setItem(LKEY,LANG)}catch(e){}
}
function switchLang(l){
 if(l===LANG)return;
 AUD.pause();applyLang(l);
 if(cur>=MODS.length)cur=-1;
 buildNav();render();updV();save();
}
$$('.lang button').forEach(b=>b.addEventListener('click',()=>switchLang(b.dataset.l)));
function initialLang(sd){
 try{const p=(new URLSearchParams(location.search).get('lang')||'').toLowerCase().slice(0,2);if(p==='pt'||p==='fr')return p}catch(e){}
 try{const x=localStorage.getItem(LKEY);if(x==='pt'||x==='fr')return x}catch(e){}
 if(sd&&(sd.g==='pt'||sd.g==='fr'))return sd.g;
 return 'fr';
}
const sd=SC.init();
applyLang(initialLang(sd));
if(sd){ST.done=Object.assign(ST.done,sd.d||{});if(sd.b!=null)ST.best=sd.b;if(sd.l&&sd.l[0]>=0&&sd.l[0]<MODS.length-1){cur=sd.l[0];scr=Math.max(0,Math.min(sd.l[1]||0,((MODS[cur].screens||[]).length||1)-1))}}
buildNav();render();updV();
